<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cozy Dogs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E">
<style>:root{--ink:#5a3d33;--ink2:#8c6d5f;--cream:#fff3df;--paper:#fffaf1;--paper2:#fff1dc;--line:#ead6bb;--pink:#ff8fb0;--pink2:#ffd0de;--mint:#6fd1a5;--sky:#6fb8ff;--sun:#ffc94d;--lav:#b79bff;--red:#ff6b6b;--sh:rgba(70,40,30,.28);
 --C:#b8a99a;--R:#5aa8ff;--E:#b06aff;--L:#ffb52e;--M:#ff5cc0;--ui:'Nunito','Quicksand','Segoe UI','Noto Sans Thai','Leelawadee UI','Tahoma',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1f2e;font-family:var(--ui);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;color:var(--ink)}
.hidden{display:none!important}
.ic{width:auto;height:18px;image-rendering:pixelated;vertical-align:-4px}.ic.big{height:26px}.ic.sm{height:14px;vertical-align:-2px}
.scr{position:fixed;inset:0;display:none}.scr.on{display:block}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink),0 10px 22px var(--sh)}
.btn{border:3px solid var(--ink);border-radius:12px;background:var(--sun);box-shadow:0 4px 0 var(--ink);font-weight:900;padding:7px 14px;font-size:14px;color:var(--ink);transition:transform .06s,box-shadow .06s,filter .1s;position:relative;top:0}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink)}.btn.mint{background:var(--mint)}.btn.sky{background:var(--sky)}.btn.lav{background:var(--lav)}.btn.red{background:var(--red);color:#fff}.btn.ghost{background:var(--paper)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}.btn.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled],.btn.dis{filter:grayscale(.8) brightness(1.05);opacity:.7;pointer-events:none}
/* ---------- login ---------- */
#login{background:#2a1f2e;overflow:hidden}
#bgc{position:absolute;inset:0;width:100%;height:100%}
.loginwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;background:radial-gradient(ellipse at center,rgba(40,20,40,.15),rgba(30,15,35,.62))}
.logo{text-align:center;animation:bob 3.2s ease-in-out infinite}
.logo h1{margin:0;font-size:clamp(44px,9vw,84px);font-weight:900;letter-spacing:2px;color:#fff4dc;text-shadow:0 2px 0 #ffb86b,0 4px 0 #e8845a,0 6px 0 #5a3d33,3px 3px 0 #5a3d33,-3px 3px 0 #5a3d33,0 12px 20px rgba(0,0,0,.4);line-height:1}
.logo p{margin:8px 0 0;color:#ffe9c9;font-weight:800;letter-spacing:3px;font-size:13px;text-transform:uppercase;text-shadow:0 2px 0 #5a3d33}
@keyframes bob{50%{transform:translateY(-6px)}}
.logincard{width:min(380px,100%);padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;border:3px solid var(--ink);background:var(--paper2);border-radius:10px;padding:7px;font-weight:900;font-size:14px}.tabs button.on{background:var(--pink);box-shadow:0 3px 0 var(--ink)}
.fld{display:block;margin-bottom:9px}.fld span{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:3px}
.fld input{width:100%;padding:9px 11px;border:3px solid var(--ink);border-radius:10px;font-size:15px;background:#fff;user-select:text;-webkit-user-select:text;outline:none}.fld input:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink2)}
.err{color:#d13c4c;font-weight:800;font-size:13px;min-height:18px;margin:2px 0 6px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.sp{flex:1}
.tip{color:#ffe9c9;font-size:12px;font-weight:700;text-shadow:0 2px 0 #5a3d33;text-align:center;max-width:380px}
/* ---------- game ---------- */
#game{background:radial-gradient(ellipse at 50% 30%,#4a3552,#241a2a 70%)}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;border:4px solid #1c1420;border-radius:6px;box-shadow:0 0 0 4px #5a3d33,0 0 60px rgba(0,0,0,.6);touch-action:none;background:#000}
#hud{position:absolute;inset:0;pointer-events:none}#hud>*{pointer-events:auto;position:absolute}
.pcard{left:10px;top:10px;padding:6px 12px 6px 6px;display:flex;gap:9px;align-items:center;min-width:176px;cursor:pointer}
.pcard .av{width:50px;height:50px;position:relative;flex:none}.pcard .av canvas.p{width:100%;height:100%;display:block;border:3px solid var(--ink);border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff3f6,var(--pink2))}
.pcard .av canvas.d{position:absolute;left:-10px;bottom:-8px;width:25px;height:25px;border:2px solid var(--ink);border-radius:50%;background:#e8f7ee}
.pcard .lv{position:absolute;right:-6px;bottom:-6px;background:var(--sun);border:2px solid var(--ink);border-radius:9px;font-size:11px;font-weight:900;padding:0 5px}
.pcard b{font-size:15px;display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{height:9px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;margin-top:3px;width:110px}.xp i{display:block;height:100%;background:linear-gradient(#9cf0c4,var(--mint));width:0;transition:width .5s}
.cur{right:10px;top:10px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:3px 10px 3px 8px;font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--ink);cursor:pointer;min-width:74px;justify-content:space-between}
.chip .plus{background:var(--mint);border:2px solid var(--ink);border-radius:50%;width:18px;height:18px;font-size:13px;line-height:13px;display:grid;place-items:center;margin-left:2px}
.chip.pop{animation:pop .4s}@keyframes pop{40%{transform:scale(1.18)}}
.loc{left:50%;top:10px;transform:translateX(-50%);padding:5px 16px;font-weight:900;font-size:14px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.loc small{font-weight:800;color:var(--ink2)}
#ticker{left:50%;top:56px;transform:translateX(-50%);background:rgba(255,250,241,.95);border:3px solid var(--ink);border-radius:18px;padding:5px 16px;font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--ink);opacity:0;transition:opacity .4s,top .4s;pointer-events:none!important;max-width:90vw;text-align:center}
#ticker.on{opacity:1;top:60px}
.dock{left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:6px;padding:7px 9px;max-width:98vw;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dk{flex:none;width:58px;border:3px solid var(--ink);border-radius:12px;background:var(--paper2);padding:3px 0 2px;box-shadow:0 3px 0 var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .08s,background .15s}
.dk:hover{background:var(--pink2);transform:translateY(-3px)}.dk:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}.dk.on{background:var(--sun)}
.dk .e{font-size:24px;line-height:28px}.dk .l{font-size:10px;font-weight:900;color:var(--ink)}
.dk .bd,.bd{position:absolute;right:-6px;top:-8px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;border:2px solid var(--ink);font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 3px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.care{left:10px;bottom:84px;width:min(318px,calc(100vw - 20px));padding:10px 12px 12px}
.care .top{display:flex;gap:10px;align-items:center}.care .th{width:62px;height:62px;border:3px solid var(--ink);border-radius:12px;background:var(--pink2);flex:none;overflow:hidden}.care .th canvas{width:100%;height:100%;display:block}
.care h4{margin:0;font-size:16px;display:flex;gap:6px;align-items:center}.care .sub{font-size:12px;font-weight:800;color:var(--ink2)}
.rar{display:inline-block;padding:0 7px;border-radius:8px;border:2px solid var(--ink);font-size:10px;font-weight:900;color:#fff;vertical-align:1px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0}
.bar{font-size:11px;font-weight:900;display:flex;align-items:center;gap:5px}.bar b{width:42px;font-weight:900}.bar i{flex:1;height:9px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;display:block}.bar i u{display:block;height:100%;text-decoration:none;transition:width .4s}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.acts .btn{padding:5px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;line-height:1.1;gap:1px}.acts .btn span{font-size:19px}
.hearts{margin-top:3px}.hearts .ic{height:11px}
.foodpick{display:none;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.foodpick.on{display:grid}
.fp{border:3px solid var(--ink);border-radius:10px;background:#fff;padding:3px 0;text-align:center;font-weight:900;font-size:10px;position:relative}.fp .e{font-size:20px;display:block}.fp.dis{opacity:.45}.fp.fav{background:#fff3c4}
.fp em{position:absolute;right:-5px;top:-7px;background:var(--pink);border:2px solid var(--ink);border-radius:9px;font-size:10px;padding:0 4px;font-style:normal}
.xbtn{position:absolute;right:6px;top:4px;border:0;background:transparent;font-size:18px;font-weight:900}
.chat{right:10px;bottom:84px;width:min(260px,calc(100vw - 20px));padding:6px;display:flex;flex-direction:column;gap:4px}
.chat .log{height:96px;overflow:auto;font-size:12px;font-weight:700;padding:2px 4px;scrollbar-width:thin;user-select:text}.chat .log div{margin:1px 0;word-break:break-word}.chat .log b{color:#d95a8a}
.chat .em{display:flex;gap:2px;justify-content:space-between}.chat .em button{border:0;background:transparent;font-size:18px;padding:0 2px;transition:transform .1s}.chat .em button:hover{transform:scale(1.3)}
.chat form{display:flex;gap:4px}.chat input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:8px;padding:4px 7px;font-size:12px;font-weight:700;user-select:text}
.chat.min .log,.chat.min form{display:none}.chat .hd{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:12px;cursor:pointer;padding:0 3px}
.online{right:10px;top:60px;width:150px;padding:6px 8px;font-size:12px;font-weight:800;max-height:35vh;overflow:auto}.online h5{margin:0 0 4px;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;cursor:pointer}
.online .pl{display:flex;align-items:center;gap:5px;padding:3px 4px;border-radius:8px;cursor:pointer}.online .pl:hover{background:var(--pink2)}.online .pl i{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}.online .pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.online .pl small{color:var(--ink2)}
.bar2{left:50%;transform:translateX(-50%);padding:8px 14px;display:flex;gap:10px;align-items:center;font-weight:900;flex-wrap:wrap;justify-content:center}
#visitbar{top:60px}#editbar{bottom:8px;width:min(860px,98vw);flex-direction:column;align-items:stretch;gap:6px;padding:8px 10px}
#editbar .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drawer{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.inv{flex:none;width:76px;border:3px solid var(--ink);border-radius:10px;background:#fff;text-align:center;padding:3px 2px;position:relative;touch-action:none;cursor:grab}.inv.dis{opacity:.4}.inv canvas{width:60px;height:50px}.inv b{font-size:10px;display:block;line-height:1.1;height:22px;overflow:hidden}
.inv em{position:absolute;right:-5px;top:-7px;background:var(--pink);border:2px solid var(--ink);border-radius:9px;font-size:11px;padding:0 5px;font-style:normal;font-weight:900}
.pill{border:2px solid var(--ink);background:var(--paper2);border-radius:14px;padding:2px 10px;font-weight:900;font-size:12px}.pill.on{background:var(--sun)}
#itembar{position:absolute;display:none;gap:6px;pointer-events:auto;z-index:5}#itembar.on{display:flex}
/* ---------- modals ---------- */
#mods{position:fixed;inset:0;pointer-events:none;z-index:50}
.ov{position:fixed;inset:0;background:rgba(36,20,40,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:10px;pointer-events:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.mod{width:min(780px,100%);max-height:min(92vh,760px);display:flex;flex-direction:column;animation:rise .2s cubic-bezier(.2,1.2,.4,1);overflow:hidden}.mod.sm{width:min(460px,100%)}.mod.lg{width:min(980px,100%)}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}
.mh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pink);border-bottom:3px solid var(--ink);font-weight:900;font-size:19px;flex:none}.mh .sp{flex:1}
.mh .x{width:32px;height:32px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);font-weight:900;font-size:16px;line-height:1;box-shadow:0 3px 0 var(--ink)}.mh .x:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.mb{padding:12px 14px 16px;overflow:auto;flex:1;min-height:0}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs2 button{border:3px solid var(--ink);background:var(--paper2);border-radius:10px;padding:4px 11px;font-weight:900;font-size:13px}.tabs2 button.on{background:var(--sun);box-shadow:0 3px 0 var(--ink);transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.gc{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:7px 6px 8px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.gc canvas{width:84px;height:84px;image-rendering:auto}.gc .nm{font-weight:900;font-size:13px;line-height:1.15;min-height:30px;display:flex;align-items:center}.gc .pr{font-weight:900;font-size:13px}
.gc.r-R{border-color:var(--R)}.gc.r-E{border-color:var(--E)}.gc.r-L{border-color:var(--L);box-shadow:0 0 0 2px #fff3c4 inset}.gc.r-M{border-color:var(--M);box-shadow:0 0 0 2px #ffe0f4 inset}
.gc.off{opacity:.55;filter:grayscale(.6)}.gc.sel{outline:4px solid var(--sky);outline-offset:1px}
.gc .tag{position:absolute;left:5px;top:5px;font-size:10px;font-weight:900;padding:0 6px;border-radius:8px;border:2px solid var(--ink);background:var(--sun)}
.gc .fv{position:absolute;right:4px;top:2px;font-size:17px;border:0;background:none;filter:grayscale(1) opacity(.5)}.gc .fv.on{filter:none}
.gc .hm{position:absolute;right:4px;bottom:50px;font-size:13px;opacity:.9}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-weight:800;font-size:14px}.kv b{color:var(--ink2);font-weight:900}
.list .li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:3px solid var(--ink);border-radius:12px;background:#fff;margin-bottom:8px}.li .g{flex:1;min-width:0}.li .g b{display:block;font-size:14px}.li .g small{color:var(--ink2);font-weight:800;font-size:12px}
.prog{height:12px;border:2px solid var(--ink);border-radius:8px;background:#f1e4cf;margin-top:4px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(#9cf0c4,var(--mint))}
.rw{font-weight:900;font-size:13px;white-space:nowrap}
.muted{color:var(--ink2);font-weight:700;font-size:13px}.center{text-align:center}
.big{font-size:22px;font-weight:900}
.swatch{width:100%;height:70px;border:3px solid var(--ink);border-radius:10px;image-rendering:pixelated;display:block}
.sel-row{display:flex;gap:6px;flex-wrap:wrap}.opt{border:3px solid var(--ink);background:#fff;border-radius:10px;padding:5px 10px;font-weight:900;font-size:13px}.opt.on{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.slider{width:100%;accent-color:var(--pink)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:2px dashed var(--line);font-weight:900}
.sw{width:50px;height:26px;border:3px solid var(--ink);border-radius:16px;background:#d9ccb8;position:relative;transition:background .15s}.sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}.sw.on{background:var(--mint)}.sw.on::after{left:24px}
/* toasts */
#toasts{position:fixed;left:50%;top:104px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 16px;font-weight:900;font-size:14px;box-shadow:0 4px 0 var(--ink),0 8px 16px var(--sh);animation:tin .25s cubic-bezier(.2,1.3,.4,1);max-width:92vw;text-align:center}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
#banner{position:fixed;left:0;right:0;top:0;z-index:95;background:var(--red);color:#fff;font-weight:900;text-align:center;padding:6px;display:none;border-bottom:3px solid var(--ink)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:99;transition:opacity .5s}
/* capsule */
.cap{display:flex;flex-direction:column;align-items:center;gap:10px}.cap canvas#capc{width:240px;height:290px;image-rendering:pixelated}
.cap .acts2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.pity{width:260px}
.reveal{position:fixed;inset:0;z-index:70;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(30,15,40,.86));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fade .2s;pointer-events:auto}
.rcard{width:230px;padding:14px;text-align:center;animation:flipin .6s cubic-bezier(.2,1.2,.4,1);position:relative;overflow:hidden}
@keyframes flipin{from{transform:rotateY(90deg) scale(.6);opacity:0}}
.rcard canvas{width:170px;height:170px}.rcard h3{margin:2px 0}.rcard .glow{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.65),transparent 30%,rgba(255,255,255,.45),transparent 60%);animation:spin 3s linear infinite;opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
.rc10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(790px,96vw);padding:0 6px}.rc10 .gc canvas{width:70px;height:70px}
.rc10 .rcard{padding:8px 6px 10px;min-width:0}.rc10 .rcard canvas{width:min(92px,100%);height:auto;aspect-ratio:1}.rc10 .rcard h3{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rc10 .rcard .muted{font-size:11px;line-height:1.25}
.reveal{overflow:auto;justify-content:safe center}
@media(max-width:700px){.rc10{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rc10 .rcard canvas{width:min(84px,100%)}}
@media(max-height:560px){.rc10{grid-template-columns:repeat(5,minmax(0,1fr))}.rc10 .rcard canvas{width:min(56px,100%)}.rc10 .rcard .muted{display:none}}
/* mini games */
.mgb{display:flex;flex-direction:column;align-items:center;gap:10px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(400px,100%)}
.mc{aspect-ratio:1;perspective:500px;border:0;background:none;padding:0}.mc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}.mc.fl .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--ink);border-radius:12px;display:grid;place-items:center;overflow:hidden}.mc .b{background:repeating-linear-gradient(45deg,#ff9bb8 0 8px,#ffb8cc 8px 16px)}.mc .b::after{content:'🐾';font-size:26px}.mc .f{background:#fff;transform:rotateY(180deg)}.mc .f canvas{width:100%;height:100%}.mc.ok .f{background:#d7f7e3}
#catchc{width:min(480px,100%);aspect-ratio:4/3;border:3px solid var(--ink);border-radius:12px;touch-action:none;background:#bfe6ff}

function applyVol(){if(!AU.ctx)return;AU.master.gain.value=S.set.vol;AU.sfx.gain.value=S.set.sound?1:0;AU.mus.gain.value=S.set.music?.55:0}
function tone(f,d=.1,type='sine',v=.12,when=0,slide=0,dest){const a=actx();if(!a||!S.set.sound&&!dest)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+when;o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.0008,t0+d);o.connect(g);g.connect(dest||AU.sfx);o.start(t0);o.stop(t0+d+.05)}
function noise(d=.1,v=.05,when=0,fq=3000,dest){const a=actx();if(!a)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(dest||AU.sfx);s.start(a.currentTime+when)}

const CH=[[48,55,59,64,67],[45,52,57,60,64],[41,48,52,57,60],[43,50,55,59,62]],mf=m=>440*Math.pow(2,(m-69)/12);
function musicStep(tm,bar,beat){const a=AU.ctx,ch=CH[bar%4],dst=AU.mus;
 const kd=()=>{const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(130,tm);o.frequency.exponentialRampToValueAtTime(42,tm+.14);g.gain.setValueAtTime(.32,tm);g.gain.exponentialRampToValueAtTime(.001,tm+.2);o.connect(g);g.connect(dst);o.start(tm);o.stop(tm+.22)};
 const tick=(v,f)=>{const n=a.sampleRate*.04|0,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();fl.type='highpass';fl.frequency.value=f;g.gain.value=v;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(dst);s.start(tm)};
 const key=(m,d,v)=>{const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='triangle';o2.type='sine';o.frequency.value=mf(m);o2.frequency.value=mf(m)*2.003;f.type='lowpass';f.frequency.value=1400;g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(v,tm+.015);g.gain.exponentialRampToValueAtTime(.0008,tm+d);o.connect(f);o2.connect(f);f.connect(g);g.connect(dst);o.start(tm);o2.start(tm);o.stop(tm+d+.05);o2.stop(tm+d+.05)};
 if(beat==0||beat==5)kd();if(beat==4)tick(.18,1800);if(beat%2==0&&beat!=4)tick(.05,7000);
 if(beat==0){ch.slice(1).forEach((m,i)=>key(m+12,2.6,.045-.004*i));key(ch[0]-12,2.2,.18)}
 if(beat==6)key(ch[0]-12+7,.9,.1);
 if([2,3,5,7].includes(beat)&&Math.random()<.7){const m=ch[1+Math.floor(Math.random()*4)]+12+(Math.random()<.3?12:0);key(m,.7,.05)}
 if(Math.random()<.35){tick(.03,3500)}}
function musicTick(){const a=AU.ctx;if(!a||!S.set.music)return;const spb=60/78/2;while(AU.next<a.currentTime+.4){const sw=AU.step%2?spb*.16:0;musicStep(AU.next+sw,Math.floor(AU.step/8),AU.step%8);AU.next+=spb;AU.step++}}
function startMusic(){const a=actx();if(!a||AU.timer)return;AU.next=a.currentTime+.1;AU.timer=setInterval(musicTick,120);AU.started=true}
function stopMusic(){clearInterval(AU.timer);AU.timer=null}

 ws.onopen=()=>{wantConn=true;res(ws)};ws.onerror=()=>rej(new Error('ws'));
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}const f=H[m.t];if(f)f(m);else if(window.DEBUG)console.log('unhandled',m.t)};
 ws.onclose=()=>{if(S.ws!==ws)return;if(S.loaded&&wantConn)onDisconnect()}})}

function gMemory(){const ids=shuffle(Object.keys(DOGS.BR)).slice(0,8),cards=shuffle([...ids,...ids]);let open=[],moves=0,matched=0,lock=false;
 const ov=gwin('🃏 '+t('Memory Match'),`<div class="row" style="gap:20px;font-weight:900"><span>${t('Moves')}: <b id="mmv">0</b></span><span>${matched}/8</span></div><div class="mem" id="memg">${cards.map((id,i)=>`<button class="mc" data-i="${i}"><div class="in"><div class="b"></div><div class="f">${thumbHTML(id,'Normal',40,null)}</div></div></button>`).join('')}</div><div id="mgres" class="center"></div>`);paintThumbs(ov);send({t:'mg_start',g:'memory'});
 $('#memg',ov).onclick=e=>{const b=e.target.closest('.mc');if(!b||lock||b.classList.contains('fl'))return;sfx('flip');b.classList.add('fl');open.push(b);if(open.length==2){moves++;$('#mmv',ov).textContent=moves;const[a,c]=open;
  if(cards[+a.dataset.i]==cards[+c.dataset.i]){a.classList.add('ok');c.classList.add('ok');matched++;open=[];sfx('ok');if(matched==8){setTimeout(()=>{$('#memg',ov).insertAdjacentHTML('afterend',`<div class="big">🎉 ${moves} ${t('Moves')}</div>`);gEnd('memory',moves)},500)}}

function gCatch(){const ov=gwin('🍪 '+t('Cookie Catch'),`<div class="row" style="gap:20px;font-weight:900"><span>${t('Time')}: <b id="ctm">20</b></span><span>${t('Score')}: <b id="csc">0</b></span></div><canvas id="catchc" width="480" height="360"></canvas><div id="mgres" class="center"><div class="muted">${S.set.lang=='th'?'ลากเมาส์/นิ้ว หรือกดลูกศร ซ้าย-ขวา':'Drag, or use ← → keys'}</div><button class="btn pink" id="cgo" style="margin-top:6px">${t('Start')}</button></div>`);
 const c=$('#catchc',ov),g=c.getContext('2d');const dog=DOGS.thumb(S.avatarBreed||'corgi','Normal',40,{noShadow:1,noGlow:1});let run=false,px=240,items=[],score=0,tl=20,last=0,spawn=0,raf=0,keys={};
 const kd=e=>{keys[e.key]=true},ku=e=>{keys[e.key]=false};addEventListener('keydown',kd);addEventListener('keyup',ku);
 const mv=e=>{const r=c.getBoundingClientRect();px=clamp((e.clientX-r.left)/r.width*480,36,444)};c.addEventListener('pointermove',mv);c.addEventListener('pointerdown',mv);
 gcleanup=()=>{run=false;cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku)};
 const draw=()=>{g.clearRect(0,0,480,360);const gr=g.createLinearGradient(0,0,0,360);gr.addColorStop(0,'#9fdcff');gr.addColorStop(1,'#e6f6ff');g.fillStyle=gr;g.fillRect(0,0,480,360);g.fillStyle='#7ccb8a';g.fillRect(0,320,480,40);g.fillStyle='#5cbc6e';g.fillRect(0,320,480,5);g.font='28px sans-serif';g.textAlign='center';for(const it of items)g.fillText(it.e,it.x,it.y);g.imageSmoothingEnabled=false;g.drawImage(dog,px-48,232,96,96)};
 const step=ms=>{if(!run)return;const dt=Math.min(.05,(ms-last)/1000);last=ms;tl-=dt;spawn-=dt;if(keys.ArrowLeft||keys.a)px-=330*dt;if(keys.ArrowRight||keys.d)px+=330*dt;px=clamp(px,36,444);
  if(spawn<=0){spawn=.42-.12*(1-tl/20);const bad=Math.random()<.2;items.push({x:rnd(24,456),y:-20,v:rnd(110,190)+(20-tl)*6,e:bad?pick(['🥦','🧅']):pick(['🍪','🦴','🍖','🧁']),bad})}
  for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.v*dt;if(it.y>296&&it.y<340&&Math.abs(it.x-px)<42){score=Math.max(0,score+(it.bad?-1:1));items.splice(i,1);sfx(it.bad?'err':'coin');$('#csc',ov).textContent=score}else if(it.y>370)items.splice(i,1)}
  $('#ctm',ov).textContent=Math.max(0,Math.ceil(tl));draw();if(tl<=0){run=false;draw();$('#mgres',ov).innerHTML=`<div class="big">${t('Score')}: ${score}</div>`;gEnd('catch',score);return}raf=requestAnimationFrame(step)};
 draw();$('#cgo',ov).onclick=()=>{$('#mgres',ov).innerHTML='';run=true;last=performance.now();send({t:'mg_start',g:'catch'});raf=requestAnimationFrame(step)}}

 const next=()=>{if(round>=5){$('#gq',ov).innerHTML=`<div class="big center">${t('Score')}: ${score}/5</div>`;gEnd('guess',score);return}round++;correct=pick(ids);const wrong=shuffle(ids.filter(i=>i!=correct&&DOGS.BR[i].name!=DOGS.BR[correct].name)).slice(0,3),opts=shuffle([correct,...wrong]);

function parkMoveTo(x,y,run){const m=Park.m[Park.me];if(!m)return;m.tx=x;m.ty=y;m.run=run;m.pose=null;send({t:'park_move',x:Math.round(x),y:Math.round(y),run:run?1:0})}
function parkPointer(e){const[wx,wy]=toWorld(e);let best=null,bd=1e9,viaHuman=false;for(const m of Object.values(Park.m)){if(m._hit){const[hx,hy,r]=m._hit,dd=Math.hypot(wx-hx,wy-hy);if(dd<r&&dd<bd){best=m;bd=dd;viaHuman=false}}
  if(m._hhit&&m.av){const[hx,hy,rx,ry]=m._hhit,dx=(wx-hx)/rx,dy=(wy-hy)/ry;if(dx*dx+dy*dy<=1){const dd=Math.hypot(wx-hx,wy-hy)*.8;if(dd<bd){best=m;bd=dd;viaHuman=true}}}}
 if(best&&!best.me){sfx('pop');playerCard(best);return}
 if(best&&best.me&&viaHuman){sfx('pop');best.emote={e:'👋',at:performance.now()};DO.wardrobe();return}
 const[x,y]=parkGround(e);parkMoveTo(x,y,Park.run||e.shiftKey);Park.marks.push({x,y,t:performance.now()});sfx('click')}

// ---------- simulation (client prediction + dead reckoning)
function stepPark(dt,now){const C=Park.cfg;
 const K=Park.keys;if(Object.keys(K).length&&now-Park.keyT>150){Park.keyT=now;const m=Park.m[Park.me];if(m){const dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(dx||dy){const l=Math.hypot(dx,dy);parkMoveTo(clamp(m.rx+dx/l*90,C.x0,C.x1),clamp(m.ry+dy/l*90,C.y0,C.y1),Park.run)}}}
 for(const m of Object.values(Park.m)){const sp=m.run?C.run:C.walk,dx=m.tx-m.ax,dy=m.ty-m.ay,d=Math.hypot(dx,dy);
  if(d>1){const s=Math.min(d,sp*dt);m.ax+=dx/d*s;m.ay+=dy/d*s}else{m.ax=m.tx;m.ay=m.ty}
  const px=m.rx,k=1-Math.exp(-dt*(m.me?28:11));m.rx+=(m.ax-m.rx)*k;m.ry+=(m.ay-m.ry)*k;if(Math.abs(m.rx-px)>.03)m.face=m.rx>px?1:-1;
  m.moving=d>1.5||Math.hypot(m.ax-m.rx,m.ay-m.ry)>1.2;m.wade=PA.inPond(m.rx,m.ry);
  if(m.run&&m.moving&&!m.wade&&!m.pose&&World.fxs.length<90){m.dust=(m.dust||0)-dt;if(m.dust<=0){m.dust=.11;fx('dust',m.rx-(m.face||1)*8+rnd(-3,3),m.ry+rnd(-2,2),{vx:-(m.face||1)*rnd(6,16),vy:-rnd(4,14),life:.42,max:.42,size:rnd(3,5)})}}
  if(m.av)AVA.stepHuman(m,dt,C)}
 const b=Park.ball;if(Math.hypot(b.vx,b.vy)>0){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<C.x0){b.x=C.x0;b.vx=Math.abs(b.vx)*.72}if(b.x>C.x1){b.x=C.x1;b.vx=-Math.abs(b.vx)*.72}if(b.y<C.y0){b.y=C.y0;b.vy=Math.abs(b.vy)*.72}if(b.y>C.y1){b.y=C.y1;b.vy=-Math.abs(b.vy)*.72}
  const f=Math.pow(.1,dt);b.vx*=f;b.vy*=f;b.rot+=(b.vx+b.vy)*dt*.05;if(Math.hypot(b.vx,b.vy)<9)b.vx=b.vy=0}
 if(now-Park.pingT>2000){Park.pingT=now;send({t:'ping',c:now});Park.rxs=Math.round(Park.rx/2);Park.rx=0}}

function drawPDog(c,m,t,now){const b=DOGS.BR[m.breed];if(!b)return;const sc=b.size*.9,mv=m.moving&&!m.pose,run=mv&&m.run,bob=mv?Math.abs(Math.sin(t*(run?17:10)))*(run?6:2.5):0;
 let trickK=null,trick=null;if(m.trick&&now-m.trickAt<DOGS.TRICK_MS){trickK=(now-m.trickAt)/DOGS.TRICK_MS;trick=m.trick}
 const state=m.pose=='sit'?'SIT':m.pose=='sleep'?'SLEEP':m.pose=='bark'?'BARK':'IDLE',sink=m.wade?5:0;
 c.save();c.translate(m.rx,m.ry);c.fillStyle='rgba(60,32,22,.24)';c.beginPath();c.ellipse(0,0,38*sc,7*sc,0,0,7);c.fill();
 c.translate(0,sink);c.scale(m.face*sc,sc);c.translate(0,-bob);if(b.r=='M'){c.shadowColor=b.acc;c.shadowBlur=14}
 const info=DOGS.sprite(c,b,m.variant,t,{state,mv,run,seed:m.seed,acc:m.acc,happy:true,trick,trickK,pet:m.emote&&now-m.emote.at<1500&&m.emote.e=='❤️'});c.restore();
 if(m.wade){c.save();c.translate(m.rx,m.ry+1);c.fillStyle='rgba(90,175,225,.5)';c.beginPath();c.ellipse(0,0,30*sc,8*sc,0,0,7);c.fill();c.strokeStyle='rgba(255,255,255,'+(.55+.3*Math.sin(t*6))+')';c.lineWidth=2;c.beginPath();c.ellipse(0,1,(26+Math.sin(t*4)*4)*sc,(6+Math.sin(t*4)*1.5)*sc,0,0,7);c.stroke();c.restore()}
 m._top=info.top*sc;m._w=info.w;m._hit=[m.rx,m.ry-m._top*.45,Math.max(28,m._top*.55)]}
function drawPTag(c,m,t,now){const b=DOGS.BR[m.breed];if(!b||m._top==null)return;const x=m.rx,y=m.ry,top=m._top;
 c.font='bold 11px '+getComputedStyle(document.body).fontFamily;c.textAlign='center';const label=m.n+' · Lv'+m.lvl,w=c.measureText(label).width+16;
 c.fillStyle=m.me?'#ff8fb0':'rgba(255,250,241,.94)';c.strokeStyle=b.r&&b.r!='C'?RCOL[b.r]:'#5a3d33';c.lineWidth=2;c.beginPath();c.roundRect(x-w/2,y+9,w,17,8);c.fill();c.stroke();c.fillStyle=m.me?'#fff':'#5a3d33';c.fillText(label,x,y+21);

 if(bub&&now-bub.at<4500){const a=Math.min(1,(4500-(now-bub.at))/600);if(m.av&&m._htop!=null&&m.hx!=null)AVA.bubble(c,m.hx,m.hy-m._htop-8,bub.m,a);else{AVA.bubble(c,x,by,bub.m,a);by-=30}}

function disc(c,x,y,sq){c.save();c.translate(x,y);c.fillStyle='rgba(60,32,22,.25)';c.beginPath();c.ellipse(0,8,12,3,0,0,7);c.fill();c.scale(1,sq);c.fillStyle='#ff6b8b';c.strokeStyle='#5a3d33';c.lineWidth=2.2;c.beginPath();c.ellipse(0,0,13,13,0,0,7);c.fill();c.stroke();c.fillStyle='#ffd0de';c.beginPath();c.ellipse(0,0,7,7,0,0,7);c.fill();c.restore()}
function drawParkExtras(c,t,now){
 for(let i=Park.mounds.length-1;i>=0;i--){const mo=Park.mounds[i],age=now-mo.at;if(age>25000){Park.mounds.splice(i,1);continue}const dig=age<1200;c.save();c.globalAlpha=age>20000?(25000-age)/5000:1;c.translate(mo.x+16,mo.y+2);c.fillStyle='#7a5238';c.beginPath();c.ellipse(0,0,13,5,0,0,7);c.fill();c.fillStyle='#98694a';c.beginPath();c.ellipse(0,-2,9,3.5,0,0,7);c.fill();c.restore();

 const me=Park.m[Park.me],h=Park.hint;if(me&&h&&now-h.at<5000){const o={hot:['🔥',TT('Burning hot!','ร้อนแรง!'),'#ff5a3c'],warm:['♨️',TT('Warm','อุ่น ๆ'),'#ff9a3c'],cool:['🌬️',TT('Cool','เย็น'),'#6fb8ff'],cold:['🧊',TT('Cold','เย็นเฉียบ'),'#8fd8ff']}[h.k];
  if(o){const a=Math.min(1,(5000-(now-h.at))/700);c.save();c.globalAlpha=a;c.font='bold 14px '+getComputedStyle(document.body).fontFamily;c.textAlign='center';c.lineWidth=4;c.strokeStyle='#5a3d33';const y=me.ry-(me._top||60)-48-((now-h.at)/5000)*10;c.strokeText(o[0]+' '+o[1],me.rx,y);c.fillStyle=o[2];c.fillText(o[0]+' '+o[1],me.rx,y);c.restore()}}}
function renderPark(c,t,now,dt){const e=env(),season=parkSeason(),P=PA.pal(season,e.weather);stepPark(dt,now);
 c.save();c.scale(World.scale,World.scale);c.imageSmoothingEnabled=false;
 PA.sky(c,t,e);c.drawImage(PA.layer(season,e.weather),0,0,800,600);PA.pondLive(c,t,e,P);
 // click markers
 for(let i=Park.marks.length-1;i>=0;i--){const mk=Park.marks[i],k=(now-mk.t)/700;if(k>1){Park.marks.splice(i,1);continue}c.strokeStyle='rgba(255,255,255,'+(1-k)*.85+')';c.lineWidth=3;c.beginPath();c.ellipse(mk.x,mk.y,10+k*22,4+k*9,0,0,7);c.stroke()}
 const ents=[];for(const p of PA.PROPS)ents.push({y:p.y,p});for(const m of Object.values(Park.m)){ents.push({y:m.ry,m});if(m.av&&m.hx!=null){ents.push({y:m.hy,h:m});ents.push({y:Math.max(m.hy,m.ry)+.3,l:m})}}for(const it of Object.values(Park.items))ents.push({y:it.y,it});ents.push({y:Park.ball.y,ball:1});

// ---- catalog names follow the language setting: S.cat.items[id].n / S.cat.food[id].n / S.cat.acc[id].n are getters that call t()
function localizeCat(C){
 if(!C)return C;
 for(const grp of [C.items,C.food,C.acc]){
  if(!grp)continue;
  for(const k in grp){
   const o=grp[k];if(!o||typeof o!='object'||typeof o.n!='string'||Object.prototype.hasOwnProperty.call(o,'_en'))continue;
   const en=o.n;
   Object.defineProperty(o,'_en',{value:en,enumerable:false});
   Object.defineProperty(o,'n',{get(){return t(en)},set(v){},enumerable:true,configurable:true});
  }
 }
 return C;
}

function locMsg(s){
 if(S.set.lang!='th'||typeof s!='string')return s;
 let m;
 if(m=/^🎓 (.+) learned “(.+)”! (.*)$/.exec(s))return'🎓 '+m[1]+' เรียนท่า “'+nice(m[2])+'” สำเร็จ! '+m[3];
 if(m=/^👏 (.+) did “(.+)”$/.exec(s))return'👏 '+m[1]+' ทำท่า “'+nice(m[2])+'”';
 if(m=/^😋 (.+) loves (.+)!$/.exec(s))return'😋 '+m[1]+' ชอบ'+t(m[2])+'มาก!';
 if(m=/^🎉 Daily bonus! (.*)$/.exec(s))return'🎉 โบนัสภารกิจรายวัน! '+m[1];
 if(m=/^📖 Collection (\d+) (.*)$/.exec(s))return'📖 สะสมครบ '+m[1]+' สายพันธุ์ '+m[2];
 if(m=/^🏆 (.+?) (\+\d.*)$/.exec(s))return'🏆 '+t(m[1])+' '+m[2];
 if(m=/^✅ Quest complete: (.+)$/.exec(s))return'✅ ภารกิจสำเร็จ: '+t(m[1]);
 if(m=/^🎨 ปลดล็อก (\w+)!$/.exec(s))return'🎨 ปลดล็อก '+nice(m[1])+'!';
 return s;
}

H.notify=m=>{toast(locMsg(m.m));sfx('notify')};
H.toast=m=>{toast(locMsg(m.m));if(/ไม่พอ|ไม่มี|ไม่ได้|เต็ม|Not enough|แล้ว$/.test(m.m)&&!/learned|ปลด|เป็นเพื่อน|ส่ง/.test(m.m))sfx('err')};
H.levelup=m=>{sfx('level');toast('⭐ '+TT('Level Up!','เลเวลอัป!')+' Lv.'+m.lvl+'  +50🪙 +1💎',4200);const r=cv.getBoundingClientRect();for(let i=0;i<5;i++)setTimeout(()=>burst(rnd(150,650),rnd(250,450),pick(['⭐','🎉','✨']),4),i*150)};
H.buy_ok=m=>{sfx('coin');const it=S.cat.items[m.id]||S.cat.food[m.id]||S.cat.acc[m.id];toast('🛍️ '+(it?it.n:m.id)+' ×'+m.n)};
H.equip_ok=m=>{sfx('ok');const d=(S.allDogs||[]).find(x=>x.id==m.dog);if(d)d.acc=m.acc;const s=S.dogs[m.dog];if(s)s.acc=m.acc;if(modOpen('prof'))renderProfile();UI.care()};
H.quests=m=>{S.quests=m;if(modOpen('quests'))renderQuests()};
H.ach=m=>{S.ach=m.list;S.coll=m.coll;if(modOpen('quests'))renderQuests();if(modOpen('coll'))renderColl()};
H.friends=m=>{S.fr=m;if(modOpen('friends'))renderFriends();UI.dock()};
H.lb=m=>{S.lb=m;if(modOpen('ranks'))renderRanks()};
// ---- wardrobe (human avatar)
H.av_ok=m=>{S.me.av=m.av;S.me.avOwn=m.own||S.me.avOwn;if(S.owner==S.name)S.ownerAv=m.av;UI.pcard();if(!m.get){Wardrobe.saved(m)}else Wardrobe.refresh()};
H.av_err=m=>{Wardrobe.failed(m)};
H.av_upd=m=>{if(m.n==S.owner)S.ownerAv=m.av};
H.park_av=m=>{const q=Park.m[m.n];if(q)q.av=m.av;if(m.n==S.name)S.me.av=m.av};
// ---------- boot ----------
(function boot(){buildIcons();DOGS.setBreeds(EMBED.breeds);S.cat=localizeCat(Object.assign({},EMBED.cat,{season:(()=>{const m=new Date().getMonth()+1;return m==10?'halloween':m==12?'christmas':''})()}));
 applyLang();initLogin();ROOM.setDeco(Login.deco);UI.cur();
 const lu=LS.get('cd_user','');$('#lUser').value=lu;
 if(S.token){S.autoResume=true;connect().then(()=>send({t:'resume',token:S.token})).catch(()=>{S.autoResume=false})}
 // keep the clock / weather label fresh
 setInterval(()=>{if(S.scr=='game')UI.loc()},20000);
 setInterval(()=>{if(S.ws&&S.ws.readyState==1&&S.loaded)send({t:'hb'})},20000);   // heartbeat: lets the server drop dead connections
 addEventListener('beforeunload',()=>{});
})();
</script>
</body></html>
