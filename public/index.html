<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cozy Dogs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E">
<style>:root{--ink:#5a3d33;--ink2:#8c6d5f;--cream:#fff3df;--paper:#fffaf1;--paper2:#fff1dc;--line:#ead6bb;--pink:#ff8fb0;--pink2:#ffd0de;--mint:#6fd1a5;--sky:#6fb8ff;--sun:#ffc94d;--lav:#b79bff;--red:#ff6b6b;--sh:rgba(70,40,30,.28);
 --C:#b8a99a;--R:#5aa8ff;--E:#b06aff;--L:#ffb52e;--M:#ff5cc0;--ui:'Nunito','Quicksand','Segoe UI','Noto Sans Thai','Leelawadee UI','Tahoma',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#2a1f2e;font-family:var(--ui);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;color:var(--ink)}
input,textarea{user-select:text;-webkit-user-select:text}   /* body is user-select:none; iPhone Safari then refuses typing in any input without the -webkit- form */
.hidden{display:none!important}
.ic{width:auto;height:18px;image-rendering:pixelated;vertical-align:-4px}.ic.big{height:26px}.ic.sm{height:14px;vertical-align:-2px}
.scr{position:fixed;inset:0;display:none}.scr.on{display:block}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink),0 10px 22px var(--sh)}
.btn{border:3px solid var(--ink);border-radius:12px;background:var(--sun);box-shadow:0 4px 0 var(--ink);font-weight:900;padding:7px 14px;font-size:14px;color:var(--ink);transition:transform .06s,box-shadow .06s,filter .1s;position:relative;top:0}@media(hover:hover){.btn:hover{filter:brightness(1.06)}}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink)}.btn.mint{background:var(--mint)}.btn.sky{background:var(--sky)}.btn.lav{background:var(--lav)}.btn.red{background:var(--red);color:#fff}.btn.ghost{background:var(--paper)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}.btn.sm:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled],.btn.dis{filter:grayscale(.8) brightness(1.05);opacity:.7;pointer-events:none}
/* ---------- login ---------- */
#login{background:#2a1f2e;overflow:hidden}
#bgc{position:absolute;inset:0;width:100%;height:100%}
.loginwrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(ellipse at center,rgba(40,20,40,.15),rgba(30,15,35,.62))}
.logo{text-align:center;animation:bob 3.2s ease-in-out infinite}
.logo h1{margin:0;font-size:clamp(44px,9vw,84px);font-weight:900;letter-spacing:2px;color:#fff4dc;text-shadow:0 2px 0 #ffb86b,0 4px 0 #e8845a,0 6px 0 #5a3d33,3px 3px 0 #5a3d33,-3px 3px 0 #5a3d33,0 12px 20px rgba(0,0,0,.4);line-height:1}
.logo p{margin:8px 0 0;color:#ffe9c9;font-weight:800;letter-spacing:3px;font-size:13px;text-transform:uppercase;text-shadow:0 2px 0 #5a3d33}
@keyframes bob{50%{transform:translateY(-6px)}}
.loginwrap>:first-child{margin-top:auto}.loginwrap>:last-child{margin-bottom:auto}   /* centred when it fits, scrollable when it does not (landscape phone, on-screen keyboard) */
.logincard{width:min(380px,100%);padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;border:3px solid var(--ink);background:var(--paper2);border-radius:10px;padding:7px;font-weight:900;font-size:14px}.tabs button.on{background:var(--pink);box-shadow:0 3px 0 var(--ink)}
.fld{display:block;margin-bottom:9px}.fld span{display:block;font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:3px}
.fld input{width:100%;padding:9px 11px;border:3px solid var(--ink);border-radius:10px;font-size:16px;background:#fff;user-select:text;-webkit-user-select:text;outline:none}      /* 16px: iOS zooms the whole page in on a smaller input and the page cannot be zoomed back */.fld input:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink2)}
.err{color:#d13c4c;font-weight:800;font-size:13px;min-height:18px;margin:2px 0 6px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.sp{flex:1}
.tip{color:#ffe9c9;font-size:12px;font-weight:700;text-shadow:0 2px 0 #5a3d33;text-align:center;max-width:380px}
/* ---------- game ---------- */
#game{background:radial-gradient(ellipse at 50% 30%,#4a3552,#241a2a 70%)}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;border:4px solid #1c1420;border-radius:6px;box-shadow:0 0 0 4px #5a3d33,0 0 60px rgba(0,0,0,.6);touch-action:none;background:#000}
#hud{position:absolute;inset:0;pointer-events:none}#hud>*{pointer-events:auto;position:absolute}
.pcard{left:10px;top:10px;padding:6px 12px 6px 6px;display:flex;gap:9px;align-items:center;min-width:176px;cursor:pointer}
.pcard .av{width:50px;height:50px;position:relative;flex:none}.pcard .av canvas.p{width:100%;height:100%;display:block;border:3px solid var(--ink);border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff3f6,var(--pink2))}
.pcard .av canvas.d{position:absolute;left:-10px;bottom:-8px;width:25px;height:25px;border:2px solid var(--ink);border-radius:50%;background:#e8f7ee}
.pcard .lv{position:absolute;right:-6px;bottom:-6px;background:var(--sun);border:2px solid var(--ink);border-radius:9px;font-size:11px;font-weight:900;padding:0 5px}
.pcard b{font-size:15px;display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{height:9px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;margin-top:3px;width:110px}.xp i{display:block;height:100%;background:linear-gradient(#9cf0c4,var(--mint));width:0;transition:width .5s}
.cur{right:10px;top:10px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:3px 10px 3px 8px;font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--ink);cursor:pointer;min-width:74px;justify-content:space-between}
.chip .plus{background:var(--mint);border:2px solid var(--ink);border-radius:50%;width:18px;height:18px;font-size:13px;line-height:13px;display:grid;place-items:center;margin-left:2px}
.chip.pop{animation:pop .4s}@keyframes pop{40%{transform:scale(1.18)}}
.loc{left:50%;top:10px;transform:translateX(-50%);padding:5px 16px;font-weight:900;font-size:14px;display:flex;gap:10px;align-items:center;white-space:nowrap}
.loc small{font-weight:800;color:var(--ink2)}
#ticker{left:50%;top:56px;transform:translateX(-50%);background:rgba(255,250,241,.95);border:3px solid var(--ink);border-radius:18px;padding:5px 16px;font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--ink);opacity:0;transition:opacity .4s,top .4s;pointer-events:none!important;max-width:90vw;text-align:center}
#ticker.on{opacity:1;top:60px}
.dock{left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:6px;padding:7px 9px;max-width:98vw;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dk{flex:none;width:58px;border:3px solid var(--ink);border-radius:12px;background:var(--paper2);padding:3px 0 2px;box-shadow:0 3px 0 var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .08s,background .15s}@media(hover:hover){.dk:hover{background:var(--pink2);transform:translateY(-3px)}}.dk:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}.dk.on{background:var(--sun)}
.dk .e{font-size:24px;line-height:28px}.dk .l{font-size:10px;font-weight:900;color:var(--ink)}
.dk .bd,.bd{position:absolute;right:-6px;top:-8px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;border:2px solid var(--ink);font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 3px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.care{left:10px;bottom:84px;width:min(318px,calc(100vw - 20px));padding:10px 12px 12px}
.care .top{display:flex;gap:10px;align-items:center}.care .th{width:62px;height:62px;border:3px solid var(--ink);border-radius:12px;background:var(--pink2);flex:none;overflow:hidden}.care .th canvas{width:100%;height:100%;display:block}
.care h4{margin:0;font-size:16px;display:flex;gap:6px;align-items:center}.care .sub{font-size:12px;font-weight:800;color:var(--ink2)}
.rar{display:inline-block;padding:0 7px;border-radius:8px;border:2px solid var(--ink);font-size:10px;font-weight:900;color:#fff;vertical-align:1px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0}
.bar{font-size:11px;font-weight:900;display:flex;align-items:center;gap:5px}.bar b{width:42px;font-weight:900}.bar i{flex:1;height:9px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden;display:block}.bar i u{display:block;height:100%;text-decoration:none;transition:width .4s}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.acts .btn{padding:5px 0;font-size:11px;display:flex;flex-direction:column;align-items:center;line-height:1.1;gap:1px}.acts .btn span{font-size:19px}
.hearts{margin-top:3px}.hearts .ic{height:11px}
.foodpick{display:none;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.foodpick.on{display:grid}
.fp{border:3px solid var(--ink);border-radius:10px;background:#fff;padding:3px 0;text-align:center;font-weight:900;font-size:10px;position:relative}.fp .e{font-size:20px;display:block}.fp.dis{opacity:.45}.fp.fav{background:#fff3c4}
.fp em{position:absolute;right:-5px;top:-7px;background:var(--pink);border:2px solid var(--ink);border-radius:9px;font-size:10px;padding:0 4px;font-style:normal}
.xbtn{position:absolute;right:6px;top:4px;border:0;background:transparent;font-size:18px;font-weight:900}
.chat{right:10px;bottom:84px;width:min(260px,calc(100vw - 20px));padding:6px;display:flex;flex-direction:column;gap:4px}
.chat .log{height:96px;overflow:auto;font-size:12px;font-weight:700;padding:2px 4px;scrollbar-width:thin;user-select:text}.chat .log div{margin:1px 0;word-break:break-word}.chat .log b{color:#d95a8a}
.chat .em{display:flex;gap:2px;justify-content:space-between}.chat .em button{border:0;background:transparent;font-size:18px;padding:0 2px;transition:transform .1s}@media(hover:hover){.chat .em button:hover{transform:scale(1.3)}}
.chat form{display:flex;gap:4px}.chat input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:8px;padding:4px 7px;font-size:12px;font-weight:700;user-select:text}
.chat.min .log,.chat.min form{display:none}.chat .hd{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:12px;cursor:pointer;padding:0 3px}
.online{right:10px;top:60px;width:150px;padding:6px 8px;font-size:12px;font-weight:800;max-height:35vh;overflow:auto}.online h5{margin:0 0 4px;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;cursor:pointer}
.online .pl{display:flex;align-items:center;gap:5px;padding:3px 4px;border-radius:8px;cursor:pointer}@media(hover:hover){.online .pl:hover{background:var(--pink2)}}.online .pl i{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}.online .pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.online .pl small{color:var(--ink2)}
.bar2{left:50%;transform:translateX(-50%);padding:8px 14px;display:flex;gap:10px;align-items:center;font-weight:900;flex-wrap:wrap;justify-content:center}
#visitbar{top:60px}#editbar{bottom:8px;width:min(860px,98vw);flex-direction:column;align-items:stretch;gap:6px;padding:8px 10px}
#editbar .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drawer{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.inv{flex:none;width:76px;border:3px solid var(--ink);border-radius:10px;background:#fff;text-align:center;padding:3px 2px;position:relative;touch-action:pan-x;cursor:grab}.inv.dis{opacity:.4}.inv canvas{width:60px;height:50px}.inv b{font-size:10px;display:block;line-height:1.1;height:22px;overflow:hidden}
.inv em{position:absolute;right:-5px;top:-7px;background:var(--pink);border:2px solid var(--ink);border-radius:9px;font-size:11px;padding:0 5px;font-style:normal;font-weight:900}
.pill{border:2px solid var(--ink);background:var(--paper2);border-radius:14px;padding:2px 10px;font-weight:900;font-size:12px}.pill.on{background:var(--sun)}
#itembar{position:absolute;display:none;gap:6px;pointer-events:auto;z-index:5;white-space:nowrap}#itembar.on{display:flex}#itembar .btn.arm{outline:3px solid #fff;animation:armpulse .4s ease-in-out infinite alternate}@keyframes armpulse{from{filter:brightness(1)}to{filter:brightness(1.3)}}
/* ---------- modals ---------- */
#mods{position:fixed;inset:0;pointer-events:none;z-index:50}
.ov{position:fixed;inset:0;background:rgba(36,20,40,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:10px;pointer-events:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.mod{width:min(780px,100%);max-height:min(92vh,760px);display:flex;flex-direction:column;animation:rise .2s cubic-bezier(.2,1.2,.4,1);overflow:hidden}.mod.sm{width:min(460px,100%)}.mod.lg{width:min(980px,100%)}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}
.mh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pink);border-bottom:3px solid var(--ink);font-weight:900;font-size:19px;flex:none}.mh .sp{flex:1}
.mh .x{width:32px;height:32px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);font-weight:900;font-size:16px;line-height:1;box-shadow:0 3px 0 var(--ink)}.mh .x:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.mb{padding:12px 14px 16px;overflow:auto;flex:1;min-height:0}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs2 button{border:3px solid var(--ink);background:var(--paper2);border-radius:10px;padding:4px 11px;font-weight:900;font-size:13px}.tabs2 button.on{background:var(--sun);box-shadow:0 3px 0 var(--ink);transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.gc{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:7px 6px 8px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.gc canvas{width:84px;height:84px;image-rendering:auto}.gc .nm{font-weight:900;font-size:13px;line-height:1.15;min-height:30px;display:flex;align-items:center}.gc .pr{font-weight:900;font-size:13px}
.gc.r-R{border-color:var(--R)}.gc.r-E{border-color:var(--E)}.gc.r-L{border-color:var(--L);box-shadow:0 0 0 2px #fff3c4 inset}.gc.r-M{border-color:var(--M);box-shadow:0 0 0 2px #ffe0f4 inset}
.gc.off{opacity:.55;filter:grayscale(.6)}.gc.sel{outline:4px solid var(--sky);outline-offset:1px}
.gc .tag{position:absolute;left:5px;top:5px;font-size:10px;font-weight:900;padding:0 6px;border-radius:8px;border:2px solid var(--ink);background:var(--sun)}
.gc .fv{position:absolute;right:4px;top:2px;font-size:17px;border:0;background:none;filter:grayscale(1) opacity(.5)}.gc .fv.on{filter:none}
.gc .hm{position:absolute;right:4px;bottom:50px;font-size:13px;opacity:.9}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-weight:800;font-size:14px}.kv b{color:var(--ink2);font-weight:900}
.list .li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:3px solid var(--ink);border-radius:12px;background:#fff;margin-bottom:8px}.li .g{flex:1;min-width:0}.li .g b{display:block;font-size:14px}.li .g small{color:var(--ink2);font-weight:800;font-size:12px}
.prog{height:12px;border:2px solid var(--ink);border-radius:8px;background:#f1e4cf;margin-top:4px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(#9cf0c4,var(--mint))}
.rw{font-weight:900;font-size:13px;white-space:nowrap}
.muted{color:var(--ink2);font-weight:700;font-size:13px}.center{text-align:center}
.big{font-size:22px;font-weight:900}
.swatch{width:100%;height:70px;border:3px solid var(--ink);border-radius:10px;image-rendering:pixelated;display:block}
.sel-row{display:flex;gap:6px;flex-wrap:wrap}.opt{border:3px solid var(--ink);background:#fff;border-radius:10px;padding:5px 10px;font-weight:900;font-size:13px}.opt.on{background:var(--sun);box-shadow:0 3px 0 var(--ink)}
.slider{width:100%;accent-color:var(--pink)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:2px dashed var(--line);font-weight:900}
.sw{width:50px;height:26px;border:3px solid var(--ink);border-radius:16px;background:#d9ccb8;position:relative;transition:background .15s}.sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}.sw.on{background:var(--mint)}.sw.on::after{left:24px}
/* toasts */
#toasts{position:fixed;left:50%;top:104px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 16px;font-weight:900;font-size:14px;box-shadow:0 4px 0 var(--ink),0 8px 16px var(--sh);animation:tin .25s cubic-bezier(.2,1.3,.4,1);max-width:92vw;text-align:center}
@keyframes tin{from{transform:translateY(-14px) scale(.9);opacity:0}}
#banner{position:fixed;left:0;right:0;top:0;z-index:95;background:var(--red);color:#fff;font-weight:900;text-align:center;padding:6px;display:none;border-bottom:3px solid var(--ink)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:99;transition:opacity .5s}
/* capsule */
.cap{display:flex;flex-direction:column;align-items:center;gap:10px}.cap canvas#capc{width:240px;height:290px;image-rendering:pixelated}
.cap .acts2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.pity{width:260px}
.reveal{position:fixed;inset:0;z-index:70;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(30,15,40,.86));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fade .2s;pointer-events:auto}
.rcard{width:230px;padding:14px;text-align:center;animation:flipin .6s cubic-bezier(.2,1.2,.4,1);position:relative;overflow:hidden}
@keyframes flipin{from{transform:rotateY(90deg) scale(.6);opacity:0}}
.rcard canvas{width:170px;height:170px}.rcard h3{margin:2px 0}.rcard .glow{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.65),transparent 30%,rgba(255,255,255,.45),transparent 60%);animation:spin 3s linear infinite;opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
.rc10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(790px,96vw);padding:0 6px}.rc10 .gc canvas{width:70px;height:70px}
.rc10 .rcard{padding:8px 6px 10px;min-width:0}.rc10 .rcard canvas{width:min(92px,100%);height:auto;aspect-ratio:1}.rc10 .rcard h3{font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rc10 .rcard .muted{font-size:11px;line-height:1.25}
.reveal{overflow:auto;justify-content:safe center}
@media(max-width:700px){.rc10{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rc10 .rcard canvas{width:min(84px,100%)}}
@media(max-height:560px){.rc10{grid-template-columns:repeat(5,minmax(0,1fr))}.rc10 .rcard canvas{width:min(56px,100%)}.rc10 .rcard .muted{display:none}}
/* mini games */
.mgb{display:flex;flex-direction:column;align-items:center;gap:10px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(400px,100%)}

.nu-egg .nu-crack svg{width:100%;height:100%;display:block;overflow:visible}
.rdy .nu-egg .nu-crack{display:block}
@keyframes nuholo{0%{background-position:0 0}100%{background-position:230% 230%}}
@keyframes nushine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.nu-mini{--w:14px;border-width:2px;box-shadow:none;display:inline-block;vertical-align:-3px}
.nu-mini:before{display:none}

/* ---------------------------------------------------------------- nest */
.nur-nest{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,215px));justify-content:center;gap:10px}
.nur-slot{position:relative;border:3px solid var(--ink);border-radius:14px;background:#fffdf7;padding:8px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;box-shadow:0 3px 0 rgba(90,61,51,.18)}
.nur-slot.rdy{background:linear-gradient(#f2fff8,#d9f7e8);border-color:#2f9e6a;box-shadow:0 3px 0 #2f9e6a,0 0 0 3px #ffffff inset,0 0 18px rgba(111,209,165,.75)}
.nur-slot.new{animation:nupop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes nupop{0%{transform:scale(.6) translateY(14px);opacity:0}60%{transform:scale(1.07)}100%{transform:none;opacity:1}}
.nur-ew{position:relative;width:104px;height:112px;flex:none}
.nur-ring{position:absolute;left:0;top:0;width:104px;height:104px;transform:rotate(-90deg);z-index:0}
.nur-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.nur-ring .bg{stroke:#efe0c8}
.nur-ring .pg{stroke:var(--rc,#ffc94d);transition:stroke-dashoffset .9s linear}
.nur-ring .in{fill:#fff;stroke:none;opacity:.7}
.nur-slot.rdy .nur-ring .pg{stroke:#3fbf86}
.nur-eg{position:absolute;left:50%;top:15px;transform:translateX(-50%);z-index:1;transform-origin:50% 100%}
.nur-eg .nu-egg{--w:54px}
.nur-cup{position:absolute;left:50%;bottom:6px;width:76px;height:24px;transform:translateX(-50%);border:3px solid var(--ink);border-radius:6px 6px 40px 40px/6px 6px 20px 20px;background:repeating-linear-gradient(98deg,#f3d4a2 0 5px,#e3b87b 5px 8px);z-index:2;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.nur-slot.wob .nur-eg{animation:nuwob 1.1s ease-in-out infinite}
.nur-slot.rdy .nur-eg{animation:nujig 1.6s ease-in-out infinite}
@keyframes nuwob{0%,100%{transform:translateX(-50%) rotate(0)}15%{transform:translateX(-50%) rotate(-9deg)}30%{transform:translateX(-50%) rotate(8deg)}45%{transform:translateX(-50%) rotate(-5deg)}60%{transform:translateX(-50%) rotate(0)}}
@keyframes nujig{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}20%{transform:translateX(-50%) translateY(-6px) scale(1.05,.96)}40%{transform:translateX(-50%) translateY(0) scale(.96,1.04)}55%{transform:translateX(-50%) rotate(-6deg)}70%{transform:translateX(-50%) rotate(6deg)}85%{transform:translateX(-50%) rotate(0)}}
.nur-fl{position:absolute;z-index:3;pointer-events:none;animation:nutw 2.4s ease-in-out infinite}
.nur-fl svg{display:block;width:100%;height:auto;fill:var(--fc,#fff3a8);filter:drop-shadow(0 1px 0 rgba(90,61,51,.45))}
@keyframes nutw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(25deg);opacity:1}}
.nur-cd{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:.5px}
.nur-slot.rdy .nur-cd{color:#1f8a58}
.nur-kind{font-size:11px;font-weight:900;color:var(--ink2);display:flex;align-items:center;gap:5px;justify-content:center;flex-wrap:wrap}
.nur-from{font-size:11px;font-weight:800;color:var(--ink2);line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:3px;justify-content:center}
.nur-from canvas{width:18px;height:18px;flex:none}
.nur-from span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50px}
.nur-sbt{display:flex;gap:6px;width:100%;margin-top:4px;justify-content:center}
.nur-sbt .btn{flex:1;padding:6px 6px;font-size:13px;white-space:nowrap}
.nur-sbt .btn.nur-off{filter:grayscale(.75) brightness(1.04);opacity:.75}
.nur-slot.empty,.nur-slot.lock{border-style:dashed;background:repeating-linear-gradient(135deg,#fff8ec 0 10px,#fff1dc 10px 20px);justify-content:center;min-height:170px;cursor:pointer;box-shadow:none}
.nur-slot.lock{cursor:default;background:repeating-linear-gradient(135deg,#f3eee6 0 10px,#ece5da 10px 20px);opacity:.92}
.nur-ghost{position:relative;width:70px;height:84px;display:grid;place-items:center}
.nur-ghost .nu-egg{--w:46px;animation:nubob 2.8s ease-in-out infinite}
.nur-ghost .nur-plus{position:absolute;right:2px;bottom:6px;width:26px;height:26px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);font-weight:900;display:grid;place-items:center;font-size:16px;line-height:1;color:#fff}
@keyframes nubob{50%{transform:translateY(-5px)}}
.nur-txt{display:flex;flex-direction:column;align-items:center;gap:3px}
.nur-slot.empty b,.nur-slot.lock b{font-size:13px}
.nur-slot.empty small,.nur-slot.lock small{font-size:11px;font-weight:800;color:var(--ink2);line-height:1.3;max-width:130px}
.nur-lockic{font-size:34px;filter:drop-shadow(0 3px 0 rgba(90,61,51,.2))}
.nur-warn{margin-top:8px;border:3px solid var(--ink);border-radius:12px;background:#fff0c9;padding:6px 10px;font-weight:800;font-size:12px;line-height:1.35}
.nur-warn:empty{display:none}
.nur-load{padding:22px 8px;text-align:center;font-weight:800;color:var(--ink2);grid-column:1/-1}

/* ---------------------------------------------------------------- new pair */
.nur-pg{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
.nur-side{display:contents}
.nur-slots{order:1;display:grid;grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr);gap:4px;align-items:stretch}
.nur-pk{order:2;min-width:0}
.nur-prev{order:3;min-width:0}
.nur-bar{order:4}
.nur-ps{position:relative;border:3px dashed #cdb89a;border-radius:14px;background:rgba(255,255,255,.7);padding:6px;display:flex;align-items:center;gap:8px;min-height:84px;cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.nur-ps.has{border-style:solid;border-color:var(--ink);background:#fff}
.nur-ps.act{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink2);background:#fff}
.nur-ps.act.has{border-color:var(--ink);box-shadow:0 0 0 3px var(--pink)}
.nur-ps .nur-pn{position:absolute;left:-3px;top:-3px;width:22px;height:22px;border-radius:50% 0 50% 0;background:var(--pink);border:3px solid var(--ink);font-weight:900;font-size:11px;display:grid;place-items:center;color:#fff;line-height:1}
.nur-ps .nur-pth{flex:none;width:58px;height:58px;border:3px solid var(--ink);border-radius:12px;background:radial-gradient(circle at 50% 35%,#fff,var(--pink2));overflow:hidden;position:relative}
.nur-ps .nur-pth canvas{width:100%;height:100%;display:block}
.nur-ps .nur-pi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nur-ps .nur-pi b{font-size:14px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.nur-ps .nur-pi small{font-size:11px;font-weight:800;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.nur-ps .nur-px{position:absolute;right:-6px;top:-8px;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);font-weight:900;font-size:12px;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 2px 0 var(--ink)}
.nur-ps.empty{flex-direction:column;justify-content:center;text-align:center;gap:2px;color:var(--ink2);font-weight:900;font-size:13px}
.nur-ps.empty small{font-size:11px;font-weight:800;line-height:1.25}
.nur-ps.empty .em{font-size:24px;filter:grayscale(.2)}
.nur-mid{position:relative;display:grid;place-items:center}
.nur-mid .hh{width:30px;height:27px;fill:#d9cfc2;transition:fill .2s}
.nur-mid.on .hh{fill:#ff6b8e;animation:nubeat 1s ease-in-out infinite;filter:drop-shadow(0 2px 0 rgba(90,61,51,.5))}
.nur-mid .fh{position:absolute;left:50%;top:50%;width:12px;opacity:0;fill:#ff8fb0;pointer-events:none}
.nur-mid .fh svg{display:block;width:100%;height:auto}
.nur-mid.on .fh{animation:nufloat 2.2s ease-in infinite}
.nur-mid.on .fh:nth-of-type(2){animation-delay:.7s;margin-left:-14px}
.nur-mid.on .fh:nth-of-type(3){animation-delay:1.4s;margin-left:6px}
@keyframes nubeat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.14)}}
@keyframes nufloat{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-46px) scale(1.15);opacity:0}}
.nur-pkh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.nur-pkh .ct{color:var(--ink2);font-weight:800;font-size:12px;margin-left:auto}
.nur-pkh .who{background:var(--pink);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 8px}
.nur-filt{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.nur-q{width:100%;border:3px solid var(--ink);border-radius:12px;padding:7px 10px;font-size:16px;background:#fff;outline:none;font-weight:700}
.nur-q:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink2)}
.nur-chips{display:flex;gap:5px;flex-wrap:wrap}
.nur-chip{border:2px solid var(--ink);background:var(--paper2);border-radius:14px;padding:3px 10px;font-weight:900;font-size:12px;display:inline-flex;align-items:center;gap:5px;min-height:32px}
@media(pointer:coarse){.nur-chip{min-height:34px;padding:3px 12px}}
.nur-chip.on{background:var(--sun);box-shadow:0 2px 0 var(--ink)}
.nur-chip i{width:9px;height:9px;border-radius:50%;background:var(--c,#b8a99a);border:1.5px solid var(--ink);display:inline-block}
.nur-dogs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.nur-dog{position:relative;border:3px solid var(--ink);border-radius:13px;background:#fff;padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;cursor:pointer;transition:transform .1s,box-shadow .1s;overflow:hidden}
@media(hover:hover){.nur-dog:not(.off):hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(90,61,51,.25)}}
.nur-dog:active{transform:scale(.97)}
.nur-dog.r-R{border-color:var(--R)}.nur-dog.r-E{border-color:var(--E)}.nur-dog.r-L{border-color:var(--L);box-shadow:inset 0 0 0 2px #fff3c4}.nur-dog.r-M{border-color:var(--M);box-shadow:inset 0 0 0 2px #ffe0f4}
.nur-dog.sel{outline:4px solid var(--pink);outline-offset:1px;background:#fff6fa}
.nur-dog .mn{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%}
.nur-dog.off .mn{opacity:.5;filter:grayscale(.75)}
.nur-dog canvas{width:62px;height:62px;display:block}
.nur-dog .nm{font-weight:900;font-size:12.5px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nur-dog .br{font-size:10.5px;font-weight:800;color:var(--ink2);line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:12px}
.nur-dog .mt{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:900;min-height:16px}
.nur-dog .mt .tr{font-size:13px;line-height:1}
.nur-dog .bd2{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;border:2px solid var(--ink);font-weight:900;font-size:12px;display:none;place-items:center;line-height:1;z-index:2}
.nur-dog.sel .bd2{display:grid}
.nur-dog .fv2{position:absolute;right:3px;top:1px;font-size:13px}
.nur-dog .why{margin-top:2px;font-size:10.5px;font-weight:900;line-height:1.2;color:#9a4b3c;background:#ffe9e2;border:2px solid #e8b8aa;border-radius:9px;padding:0 6px;max-width:100%}
.nur-dog .mixed{font-size:10px;font-weight:900;color:#8a55d6}
.nur-empty{grid-column:1/-1}
.nur-skel{height:104px;border-radius:13px;border:3px dashed #e6d4ba;background:linear-gradient(100deg,#fff8ec 30%,#fff 50%,#fff8ec 70%);background-size:200% 100%;animation:nusk 1.2s linear infinite}
@keyframes nusk{to{background-position:-200% 0}}

/* ---------------------------------------------------------------- preview */
.nur-pv{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:9px 10px 10px;display:flex;flex-direction:column;gap:8px;min-height:228px}
.nur-pv.empty{align-items:center;justify-content:center;text-align:center;gap:6px;color:var(--ink2);font-weight:800;font-size:13px}
.nur-pv.empty .nu-egg{--w:52px;animation:nubob 2.8s ease-in-out infinite}
.nur-pvh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px}
.nur-pvh .nu-egg{--w:20px;border-width:2px}
.nur-genes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nur-gp{display:flex;align-items:center;gap:3px;flex-wrap:wrap;border:2px solid var(--line);background:#fffaf1;border-radius:12px;padding:2px 6px;font-size:11.5px;font-weight:900}
.nur-gp .x{color:var(--ink2);font-weight:900}
.nur-al{display:inline-flex;align-items:center;gap:3px;font-weight:900;font-size:11.5px;white-space:nowrap}
.nur-al i{width:9px;height:9px;border-radius:50%;background:var(--c,#b8a99a);border:1.5px solid var(--ink);display:inline-block;flex:none}
.nur-sub{font-weight:900;font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.nur-or{display:grid;grid-template-columns:40px minmax(0,1fr) 54px;gap:8px;align-items:center;padding:5px 6px;border:2px solid var(--line);border-radius:12px;background:#fffdf8}
.nur-or .th{width:40px;height:40px;border:2px solid var(--ink);border-radius:10px;background:radial-gradient(circle at 50% 35%,#fff,var(--pink2));overflow:hidden}
.nur-or .th canvas{width:100%;height:100%;display:block}
.nur-or .nm{display:flex;flex-direction:column;gap:1px;line-height:1.2}
.nur-or .nm b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.nur-or .tg{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.nur-or .lead{font-size:10.5px;font-weight:800;color:var(--ink2)}
.nur-or .pc{text-align:right;font-weight:900;font-size:15px;line-height:1}
.nur-or .pc small{display:block;font-size:10px;font-weight:800;color:var(--ink2);margin-top:2px}
.nur-or .bar3{grid-column:1/-1;height:7px;border:2px solid var(--ink);border-radius:6px;background:#f1e4cf;overflow:hidden;margin-top:-2px}
.nur-or .bar3 i{display:block;height:100%;background:linear-gradient(#ffb6cf,var(--pink))}
.nur-or.mut{background:linear-gradient(100deg,#fff8d6,#ffeaf6,#e9f3ff);border-color:#e7c8ff}
.nur-or.mut .th{background:radial-gradient(circle at 50% 35%,#fff,#e8d9ff)}
.nur-or.mut .bar3 i{background:linear-gradient(90deg,#ffe27a,#ff9bd0,#a8c8ff)}
.nur-tag{display:inline-block;border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-size:10px;font-weight:900;line-height:15px;background:#fff}
.nur-tag.pure{background:#e8f7ee}.nur-tag.mix{background:#efe4ff;color:#6a3fb5}.nur-tag.mutt{background:#fff3b8}
.nur-trs{display:flex;flex-wrap:wrap;gap:5px}
.nur-trn{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:11px;padding:1px 7px 1px 5px;font-size:11.5px;font-weight:900;background:#fff;white-space:nowrap}
.nur-trn.t1{background:#e6f8ee}.nur-trn.t2{background:#efe6ff}.nur-trn.t3{background:#fff0bd}
.nur-trn i{font-style:normal;color:var(--ink2);font-size:10.5px}
.nur-ln{font-size:12px;font-weight:800;line-height:1.4;color:var(--ink)}
.nur-ln b{font-weight:900}
.nur-ln .g{color:#1f8a58}.nur-ln .bad{color:#c0392b}
.nur-pillrow{display:flex;flex-wrap:wrap;gap:6px}
.nur-fact{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--ink);border-radius:12px;background:#fffaf1;padding:2px 8px;font-size:12px;font-weight:900}
.nur-fact.bad{background:#ffe3e0;border-color:#c0392b;color:#8b2418}
.nur-eggs{display:flex;flex-wrap:wrap;gap:6px}
.nur-eggs .ec{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);border-radius:11px;background:#fff;padding:1px 7px 1px 5px;font-size:11.5px;font-weight:900}
.nur-bar{position:sticky;bottom:-2px;z-index:7;border:3px solid var(--ink);border-radius:15px;background:linear-gradient(#fff,#fff4f8);padding:7px 8px;display:flex;align-items:center;gap:8px;box-shadow:0 -6px 12px rgba(255,244,230,.9),0 3px 0 rgba(90,61,51,.25);flex-wrap:wrap}
.nur-bar .sum{flex:1 1 130px;display:flex;flex-direction:column;gap:2px;min-width:0}
.nur-bar .sum .pr{display:flex;gap:10px;font-weight:900;font-size:13px;flex-wrap:wrap}
.nur-bar .sum .pr .bad{color:#c0392b}
.nur-bar .why{font-size:11.5px;font-weight:800;color:#9a4b3c;line-height:1.3}
.nur-bar .why.ok{color:#1f8a58}
.nur-bar .btn{flex:0 0 auto;padding:10px 16px;font-size:15px;min-height:46px;white-space:nowrap}
.nur-bar.idle{position:static;box-shadow:0 3px 0 rgba(90,61,51,.2)}
.nur-bar .btn.nur-off{filter:grayscale(.75) brightness(1.05);opacity:.78}
.nur-bar .btn.busy{filter:brightness(1.05);opacity:.85;animation:nubeat 1s infinite}

/* ---------------------------------------------------------------- guide */
.nur-guide{border:3px solid var(--ink);border-radius:16px;background:linear-gradient(#eef8ff,#f4f1ff);box-shadow:0 3px 0 rgba(90,61,51,.16);overflow:hidden}
.nur-guide>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px;min-height:44px}
.nur-guide>summary::-webkit-details-marker{display:none}
.nur-guide>summary:after{content:"▾";margin-left:auto;font-size:16px;transition:transform .2s}
.nur-guide[open]>summary:after{transform:rotate(180deg)}
.nur-gb{padding:0 12px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.nur-gc{border:3px solid var(--ink);border-radius:13px;background:#fff;padding:8px 10px;font-size:12.5px;font-weight:700;line-height:1.5}
.nur-gc h4{margin:0 0 4px;font-size:14px;font-weight:900}
.nur-gc p{margin:3px 0}
.nur-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nur-steps div{border:2px dashed var(--line);border-radius:11px;padding:5px 6px;text-align:center;font-weight:800;font-size:11.5px;line-height:1.3}
.nur-steps span{display:block;font-size:22px}
.nur-trl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:5px}
.nur-trl .r{display:flex;gap:7px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:4px 7px;background:#fffdf8}
.nur-trl .r span{font-size:20px;line-height:1.1;flex:none}
.nur-trl .r b{display:block;font-size:12px;line-height:1.2}
.nur-trl .r small{display:block;font-size:11px;font-weight:700;color:var(--ink2);line-height:1.3}
.nur-tier{display:flex;align-items:center;gap:6px;font-weight:900;font-size:12px;margin:6px 0 3px}
.nur-tier i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.nur-tbl{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:12px;font-weight:800}
.nur-tbl td,.nur-tbl th{padding:3px 6px;text-align:left;border-bottom:2px dashed var(--line)}
.nur-tbl th{font-size:11px;color:var(--ink2);text-transform:uppercase}
.nur-stages{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nur-stages span.st{border:2px solid var(--ink);border-radius:10px;padding:1px 8px;background:#fffaf1;font-weight:900;font-size:12px}
.nur-stages span.st.ad{background:var(--mint)}

/* ---------------------------------------------------------------- hatch result (fallback when Egg.reveal is not around) */
.nurres .mb{background:linear-gradient(#fff7ea,#ffeaf2)}
.nur-res{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:2px;overflow:hidden}

 const K=Park.keys;if(Object.keys(K).length&&now-Park.keyT>150){Park.keyT=now;const m=Park.m[Park.me];if(m){const dx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),dy=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);if(dx||dy){const l=Math.hypot(dx,dy);parkMoveTo(clamp(m.rx+dx/l*90,C.x0,C.x1),clamp(m.ry+dy/l*90,C.y0,C.y1),Park.run)}}}
 for(const m of Object.values(Park.m)){const sp=m.run?C.run:C.walk,dx=m.tx-m.ax,dy=m.ty-m.ay,d=Math.hypot(dx,dy);
  if(d>1){const s=Math.min(d,sp*dt);m.ax+=dx/d*s;m.ay+=dy/d*s}else{m.ax=m.tx;m.ay=m.ty}
  const px=m.rx,k=1-Math.exp(-dt*(m.me?28:11));m.rx+=(m.ax-m.rx)*k;m.ry+=(m.ay-m.ry)*k;if(Math.abs(m.rx-px)>.03)m.face=m.rx>px?1:-1;
  m.moving=d>1.5||Math.hypot(m.ax-m.rx,m.ay-m.ry)>1.2;m.wade=PA.inPond(m.rx,m.ry);
  if(m.run&&m.moving&&!m.wade&&!m.pose&&World.fxs.length<90){m.dust=(m.dust||0)-dt;if(m.dust<=0){m.dust=.11;fx('dust',m.rx-(m.face||1)*8+rnd(-3,3),m.ry+rnd(-2,2),{vx:-(m.face||1)*rnd(6,16),vy:-rnd(4,14),life:.42,max:.42,size:rnd(3,5)})}}
  if(m.av)AVA.stepHuman(m,dt,C)}
 const b=Park.ball;if(Math.hypot(b.vx,b.vy)>0){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<C.x0){b.x=C.x0;b.vx=Math.abs(b.vx)*.72}if(b.x>C.x1){b.x=C.x1;b.vx=-Math.abs(b.vx)*.72}if(b.y<C.y0){b.y=C.y0;b.vy=Math.abs(b.vy)*.72}if(b.y>C.y1){b.y=C.y1;b.vy=-Math.abs(b.vy)*.72}
  const f=Math.pow(.1,dt);b.vx*=f;b.vy*=f;b.rot+=(b.vx+b.vy)*dt*.05;if(Math.hypot(b.vx,b.vy)<9)b.vx=b.vy=0}
 if(now-Park.pingT>2000){Park.pingT=now;send({t:'ping',c:now});Park.rxs=Math.round(Park.rx/2);Park.rx=0}}

function drawPDog(c,m,t,now){const b=DOGS.b(m);if(!b)return;const sc=b.size*.9,mv=m.moving&&!m.pose,run=mv&&m.run,bob=mv?Math.abs(Math.sin(t*(run?17:10)))*(run?6:2.5):0;
 let trickK=null,trick=null;if(m.trick&&now-m.trickAt<DOGS.TRICK_MS){trickK=(now-m.trickAt)/DOGS.TRICK_MS;trick=m.trick}
 const state=m.pose=='sit'?'SIT':m.pose=='sleep'?'SLEEP':m.pose=='bark'?'BARK':'IDLE',sink=m.wade?5:0;
 c.save();c.translate(m.rx,m.ry);c.fillStyle='rgba(60,32,22,.24)';c.beginPath();c.ellipse(0,0,38*sc,7*sc,0,0,7);c.fill();
 c.translate(0,sink);c.scale(m.face*sc,sc);c.translate(0,-bob);if(b.r=='M'){c.shadowColor=b.acc;c.shadowBlur=14}
 const info=DOGS.sprite(c,b,m.variant,t,{state,mv,run,seed:m.seed,acc:m.acc,happy:true,trick,trickK,pet:m.emote&&now-m.emote.at<1500&&m.emote.e=='❤️'});c.restore();
 if(m.wade){c.save();c.translate(m.rx,m.ry+1);c.fillStyle='rgba(90,175,225,.5)';c.beginPath();c.ellipse(0,0,30*sc,8*sc,0,0,7);c.fill();c.strokeStyle='rgba(255,255,255,'+(.55+.3*Math.sin(t*6))+')';c.lineWidth=2;c.beginPath();c.ellipse(0,1,(26+Math.sin(t*4)*4)*sc,(6+Math.sin(t*4)*1.5)*sc,0,0,7);c.stroke();c.restore()}

 c.fillStyle=m.me?'#ff8fb0':'rgba(255,250,241,.94)';c.strokeStyle=b.r&&b.r!='C'?RCOL[b.r]:'#5a3d33';c.lineWidth=2;c.beginPath();c.roundRect(x-w/2,y+9,w,17,8);c.fill();c.stroke();c.fillStyle=m.me?'#fff':'#5a3d33';c.fillText(label,x,y+21);if(m.cr){c.font='15px sans-serif';c.fillText('👑',x-w/2-9,y+23);c.font='bold 11px '+UIF()}

 for(let i=Park.mounds.length-1;i>=0;i--){const mo=Park.mounds[i],age=now-mo.at;if(age>25000){Park.mounds.splice(i,1);continue}const dig=age<1200;c.save();c.globalAlpha=age>20000?(25000-age)/5000:1;c.translate(mo.x+16,mo.y+2);c.fillStyle='#7a5238';c.beginPath();c.ellipse(0,0,13,5,0,0,7);c.fill();c.fillStyle='#98694a';c.beginPath();c.ellipse(0,-2,9,3.5,0,0,7);c.fill();c.restore();
  if(dig&&Math.random()<.5)fx('spark',mo.x+rnd(8,24),mo.y-4,{vx:rnd(-30,30),vy:-rnd(30,70),g:150,life:.6,max:.6,size:3,col:'#8a5a3a'})}
 const f=Park.fb;if(f){const k=1-(f.land-now)/1700;c.save();if(k<1){const kk=clamp(k,0,1),x=f.x-160*(1-kk),y=f.y-Math.sin(kk*Math.PI)*120-(1-kk)*60;disc(c,x,y,.35+.25*Math.abs(Math.sin(t*14)))}
  else{c.strokeStyle='rgba(255,230,120,'+(.5+.4*Math.sin(t*8))+')';c.lineWidth=3;c.beginPath();c.ellipse(f.x,f.y,22+Math.sin(t*6)*3,8,0,0,7);c.stroke();disc(c,f.x,f.y-6,.4)}c.restore();
  if(k<1){c.save();c.fillStyle='rgba(255,230,120,.35)';c.beginPath();c.ellipse(f.x,f.y,22*clamp(k,0,1),8*clamp(k,0,1),0,0,7);c.fill();c.restore()}}
 const me=Park.m[Park.me],h=Park.hint;if(me&&h&&now-h.at<5000){const o={hot:['🔥',TT('Burning hot!','ร้อนแรง!'),'#ff5a3c'],warm:['♨️',TT('Warm','อุ่น ๆ'),'#ff9a3c'],cool:['🌬️',TT('Cool','เย็น'),'#6fb8ff'],cold:['🧊',TT('Cold','เย็นเฉียบ'),'#8fd8ff']}[h.k];
  if(o){const a=Math.min(1,(5000-(now-h.at))/700);c.save();c.globalAlpha=a;c.font='bold 14px '+UIF();c.textAlign='center';c.lineWidth=4;c.strokeStyle='#5a3d33';const y=me.ry-(me._top||60)-48-((now-h.at)/5000)*10;c.strokeText(o[0]+' '+o[1],me.rx,y);c.fillStyle=o[2];c.fillText(o[0]+' '+o[1],me.rx,y);c.restore()}}}

function localizeCat(C){
 if(!C)return C;
 for(const grp of [C.items,C.food,C.acc]){
  if(!grp)continue;
  for(const k in grp){
   const o=grp[k];if(!o||typeof o!='object'||typeof o.n!='string'||Object.prototype.hasOwnProperty.call(o,'_en'))continue;
   const en=o.n;
   Object.defineProperty(o,'_en',{value:en,enumerable:false});
   Object.defineProperty(o,'n',{get(){return t(en)},set(v){},enumerable:true,configurable:true});
  }
 }
 return C;
}

function raceTap(side){if(MP.g!='race'||MP.state!='play')return;const pad=$(side?'#padR':'#padL');if(pad){pad.classList.add('hit');setTimeout(()=>pad.classList.remove('hit'),70)}
 if(side===MP.lastSide){const h=$('#racehint');if(h){h.textContent=TT('Alternate! ◀ ▶ ◀ ▶','สลับข้างสิ! ◀ ▶ ◀ ▶');h.style.color='#d13c4c'}return}
 MP.lastSide=side;MP.loc=Math.min(100,MP.loc+1.8);send({t:'mp_tap',s:side});sfx('step');const h=$('#racehint');if(h){h.style.color='';h.textContent=TT('Go go go!','เร็วเข้า!')}}
addEventListener('keydown',e=>{if(MP.g!='race'||e.repeat||!mpRoomOpen())return;const k=e.key.toLowerCase();if(k=='a'||k=='arrowleft'){e.preventDefault();raceTap(0)}else if(k=='d'||k=='arrowright'){e.preventDefault();raceTap(1)}});
H.mp_s=m=>{if(MP.g!='race')return;MP.pos=m.p;MP.fin=m.f;if(MP.state=='count'||MP.state=='play'){if(MP.loc<m.p[MP.me])MP.loc=m.p[MP.me];if(MP.loc>m.p[MP.me]+5)MP.loc=m.p[MP.me]+5}};
function raceLoop(){const c=$('#racec');if(!c||MP.g!='race'){return}const g=c.getContext('2d'),now=performance.now(),t=now/1000,n=MP.pl.length,LH=74,W=640,X0=64,X1=592;
 const k=cdText(),ov=$('#raceov');
 if(MP.state=='count'){if(k<=0){MP.state='play';sfx('go');if(ov){ov.textContent='GO!';ov.classList.add('go');setTimeout(()=>ov&&ov.classList.add('off'),700)}}else if(ov){if(MP.lastTick!=k){MP.lastTick=k;sfx('tick');ov.textContent=k;ov.classList.remove('off','go')}}}
 g.clearRect(0,0,W,c.height);g.imageSmoothingEnabled=false;
 for(let i=0;i<n;i++){const y0=14+i*LH;g.fillStyle=i%2?'#a6dc86':'#b6e898';g.fillRect(0,y0,W,LH-4);g.fillStyle='rgba(255,255,255,.35)';for(let x=X0;x<X1;x+=(X1-X0)/10)g.fillRect(x-1,y0,2,LH-4);
  g.fillStyle='#e9c98f';g.fillRect(0,y0+LH-14,W,6);
  // finish line
  for(let r=0;r<(LH-4)/8;r++){g.fillStyle=r%2?'#fff':'#333';g.fillRect(X1+22,y0+r*8,8,8);g.fillStyle=r%2?'#333':'#fff';g.fillRect(X1+30,y0+r*8,8,8)}
  const target=i==MP.me?Math.max(MP.pos[i]||0,MP.loc):(MP.pos[i]||0);MP.shown[i]=(MP.shown[i]||0)+(target-(MP.shown[i]||0))*Math.min(1,.28+(i==MP.me?.3:0));
  MP.mv=MP.mv||[];if(Math.abs(target-(MP.prev[i]||0))>.02)MP.mv[i]=now;MP.prev[i]=target;
  const p=MP.pl[i],b=DOGS.BR[p.breed],x=X0+(X1-X0)*(MP.shown[i]/100),y=y0+LH-18,moving=MP.state=='play'&&!MP.fin[i]&&now-(MP.mv[i]||0)<380;
  if(b){g.save();g.translate(x,y);g.fillStyle='rgba(60,32,22,.22)';g.beginPath();g.ellipse(0,0,26,5,0,0,7);g.fill();const sc=.62*b.size;g.translate(0,moving?-Math.abs(Math.sin(t*14+i))*4:0);g.scale(sc,sc);
   DOGS.sprite(g,b,p.variant,t+i*.3,{state:MP.fin[i]?'SIT':moving?'RUN':'IDLE',mv:moving&&!MP.fin[i],run:true,seed:i,acc:p.acc,happy:true,noAura:true});g.restore()}
  g.font='bold 11px sans-serif';g.textAlign='left';g.fillStyle=i==MP.me?'#d8325f':'#3b2a24';g.fillText((p.bot?'🤖 ':'')+p.n+(i==MP.me?' ★':''),6,y0+12);
  if(MP.fin[i]){g.font='16px sans-serif';g.fillText('🏁',X1+42,y0+LH/2+4)}}
 if(MP.state!='done')MP.raf=requestAnimationFrame(raceLoop)}

function why(d){
 const R=DOGS.raw[d.breed];if(R&&R.pm)return{k:'prem',s:'👑 '+TT('Premium','พรีเมียม'),l:`${d.name}: `+TT('premium breeds cannot breed','สายพันธุ์พรีเมียมผสมพันธุ์ไม่ได้')};

 if(Number.isFinite(d.born)){const st=TRD.stageOf(d.born,sv,gk);if(st<3){const ms=Math.max(0,TRD.ADULT_MS/gk-(sv-d.born)),sg=TRD.STAGES[st];

 const r=restLeft(d);if(r>0)return{k:'rest',ms:r,s:'😴 '+TT('rests ','พักอีก ')+nDur(r),l:`${d.name} `+TT(`is resting for ${nDur(r)}`,`ยังพักอยู่อีก ${nDur(r)}`)};
 return null}

const queueF={nest:0,side:0,pick:0};
function queue(k){if(k)for(const x of k.split(','))queueF[x]=1;if(Z.timer)return;Z.timer=setTimeout(flush,30)}
function flush(){clearTimeout(Z.timer);Z.timer=0;if(!ov()){queueF.nest=queueF.side=queueF.pick=0;return}
 if(queueF.pick){renderPicker();queueF.side=1}
 if(queueF.nest||queueF.bar)renderNest();
 if(queueF.side||queueF.nest||queueF.bar||queueF.me)renderSide();
 queueF.nest=queueF.side=queueF.pick=0;queueF.bar=0;queueF.me=0}
function shell(){return`<div class="nur">
 <section class="nur-sec nur-nestsec"><div class="nur-h"><b>🪺 ${TT('Nest','รังไข่')}</b><span class="pill" data-ncount>–</span><span class="nur-hint">${TT('The egg colour hints how rare the babies can be','สีของไข่บอกใบ้ว่าลูกหมาจะหายากแค่ไหน')}</span></div><div class="nur-nest"></div><div class="nur-warn"></div></section>
 <section class="nur-sec nur-pairsec" data-pairsec><div class="nur-h"><b>💞 ${TT('New pair','จับคู่ใหม่')}</b><span class="nur-hint">${TT('Pick two grown-up dogs - each gives one breed gene to the egg','เลือกหมาโตเต็มวัย 2 ตัว แต่ละตัวส่งยีนสายพันธุ์ให้ไข่ตัวละ 1 ชุด')}</span></div>
  <div class="nur-pg">
   <div class="nur-pk"><div class="nur-pkh"></div><div class="nur-filt"><input class="nur-q" type="search" maxlength="30" autocomplete="off" placeholder="🔍 ${esc(TT('Search name or breed…','ค้นหาชื่อหรือสายพันธุ์…'))}" value="${esc(Z.q)}"><div class="nur-chips"></div></div><div class="nur-dogs"></div></div>
   <div class="nur-side"><div class="nur-slots"></div><div class="nur-prev"></div><div class="nur-bar"></div></div></div></section>
 <details class="nur-guide"></details></div>`}
function nurOpen(fresh){
 Z.loadT=Date.now();send({t:'nur_get'});send({t:'dogs_get'});
 let o=modOpen(NU);
 if(!o){o=modal(NU,'🧬 '+TT('Dog Nursery','บ้านเลี้ยงลูกหมา'),shell(),'lg nurm');
  const g=$('.nur-guide',o);g.innerHTML=guideHTML();
  o.addEventListener('input',e=>{if(e.target.classList.contains('nur-q')){Z.q=e.target.value;renderPicker()}});
  o.addEventListener('close',()=>{unlock()});
  clearTimeout(Z.rt);Z.rt=setTimeout(()=>{if(ov()&&!S.nur)renderNest()},5200)}
 queue('nest,side,pick');flush();
 return o}
DO.nursery=()=>{nurOpen()};

// "breed this dog": the dog profile calls it with data-id; the nursery opens with that dog as parent 1
DO.nurpick=d=>{const id=d&&d.id!=null?String(d.id):'';Z.sel={a:null,b:null,act:1};Z.pre=id||null;nurOpen();applyPre()};

DO.nurclr=(d,el,e)=>{e&&e.stopPropagation&&e.stopPropagation();const n=+d.s==2?2:1;Z.sel[n==1?'a':'b']=null;Z.sel.act=n;markSel();queue('side')};

DO.nuronly=()=>{Z.only=!Z.only;renderPicker()};

 if(Z.sel.a!=null&&String(Z.sel.a)==String(id)){Z.sel.a=null;Z.sel.act=1}
 else if(Z.sel.b!=null&&String(Z.sel.b)==String(id)){Z.sel.b=null;Z.sel.act=2}
 else{if(w){toast(w.l);sfx('err');return}
  let n=Z.sel.act==2?2:1;if(Z.sel[n==1?'a':'b']!=null&&Z.sel[n==1?'b':'a']==null)n=3-n;

 const go=()=>{const s=pairState();if(!s.ok||!lock('p',1600))return;send({t:'nur_pair',a:String(Z.sel.a),b:String(Z.sel.b)})};
 if(ps.cost>=600)ask(TT(`Pair ${esc(ps.a.name)} and ${esc(ps.b.name)}?\nThe fee is ${ps.cost} coins.`,`จับคู่ ${esc(ps.a.name)} กับ ${esc(ps.b.name)} ไหม?\nค่าผสมพันธุ์ ${ps.cost} เหรียญ`),go,{yes:'💞 '+TT('Lay egg','จับคู่ & วางไข่'),title:'💞 '+TT('Lay an egg','วางไข่'),cls:'pink'});else go()};
DO.nurhatch=d=>{const e=eggOf(d.id);if(!e)return;
 if(remain(e)>0){toast(TT('Not ready yet - a little more waiting 🥚','ไข่ยังไม่ฟัก รออีกนิดนะ 🥚'));sfx('err');return}
 if((S.me.total|0)>=maxDogs()){toast(TT(`Your dog storage is full (${maxDogs()}). Sell or release a dog first.`,`ที่เก็บหมาเต็มแล้ว (${maxDogs()} ตัว) ขายหรือปล่อยบางตัวก่อนนะ`));sfx('err');return}
 if(!lock('h'+e.id,2500))return;send({t:'nur_hatch',id:String(e.id)})};

 return`<div class="psc r-${b.r} ${gem?'gem':'coin'} ${sold?'sold':''}">

  <div class="psc-st ${p.left==1?'low':''}"><span class="pips">${pips}</span><span>${sold?TT('0 left','หมดแล้ว'):p.left==1?TT('Only 1 left!','เหลือแค่ 1 ตัว!'):TT(`${p.left}/${p.max} left`,`เหลือ ${p.left}/${p.max}`)}</span></div>
  <div class="psc-pr">${priceHTML(cur,n)}</div>
  ${psBuyBtn({k:'p',id:p.id,cls:gem?'sky':'pink'},why,sold?TT('Sold out','ขายหมดแล้ว'):'🛒 '+TT('Buy','ซื้อ'))}</div>`}
function offerCard(o){const b=DOGS.BR[o.id];if(!b)return'';const s=PS.shop,capHit=s.bought>=s.cap,sold=o.left<=0;
 const why=sold?TT('Sold out','ขายหมดแล้ว'):capHit?TT(`You bought ${s.cap} today · come back tomorrow`,`วันนี้ซื้อครบ ${s.cap} ตัวแล้ว · พรุ่งนี้มาใหม่นะ`):fullWhy()||payWhy('c',o.c);

  <div class="psc-art" data-do="psplay">${anim(o.id,o.v,null)}${sold?`<div class="psc-sold">${TT('SOLD OUT','ขายหมดแล้ว')}</div>`:''}</div>

  <div class="psc-st ${o.left==1?'low':''}"><span class="pips">${Array.from({length:Math.max(o.left,1)},(_,i)=>`<i class="${i<o.left?'on':''}"></i>`).join('')}</span><span>${sold?TT('0 left','หมดแล้ว'):TT(`${o.left} left`,`เหลือ ${o.left} ตัว`)}</span></div>
  <div class="psc-pr">${priceHTML('c',o.c)}</div>

 const capHit=s.bought>=s.cap,coin=s.prem.filter(p=>p.c>0).sort((a,b)=>a.c-b.c),gem=s.prem.filter(p=>p.g>0).sort((a,b)=>a.g-b.g);

 <div class="psg offers">${s.offers.map(offerCard).join('')}</div>
 <div class="psfoot">💡 ${TT(`You can buy up to ${s.cap} dogs from the shop each day. Dogs you buy arrive as babies.`,`ซื้อน้องหมาจากร้านได้วันละ ${s.cap} ตัวนะ · น้องหมาที่ซื้อจะมาเป็นเบบี๋ตัวน้อย`)}</div>`}

const askArt=(key,v,acc)=>`<span class="psask">${anim(key,v,acc,200,150)}`;
function psAsk(o){      // o: {title,html,yes,cls,go}
 ask(o.html,o.go,{title:o.title,yes:o.yes,cls:o.cls});const ov=modOpen('ask');if(ov)psPaint(ov)}
DO.psbuy=d=>{const s=PS.shop;if(!s)return;let id,v='Normal',cur,n,left,prem=d.k=='p',msg;
 if(prem){const p=s.prem.find(x=>x.id==d.id);if(!p)return;id=p.id;cur=p.g>0?'g':'c';n=p.g>0?p.g:p.c;left=p.left}
 else{const o=s.offers.find(x=>x.i==+d.i);if(!o)return;id=o.id;v=o.v;cur='c';n=o.c;left=o.left}
 const b=DOGS.BR[id];if(!b)return;

 if(why){toast('🚫 '+why);sfx('err');return}
 const have=cur=='g'?S.me.gems:S.me.coins,nm=esc(b.name),vr=v!='Normal'?` (${esc(varName(v))})`:'';
 psAsk({title:'🐾 '+TT('Buy this dog?','ซื้อน้องหมาตัวนี้?'),yes:'🛒 '+TT('Buy','ซื้อเลย'),cls:cur=='g'?'sky':'pink',
  html:`${askArt(id,v,null)}<b class="psask-n">${nm}${vr}</b></span><span class="psask-l">${TT('Price','ราคา')}: <b>${priceHTML(cur,n)}</b></span><span class="psask-s">${TT('You have','คุณมี')} ${priceHTML(cur,have)} → ${TT('left','เหลือ')} ${priceHTML(cur,have-n)}</span>${prem?`<span class="psask-s">✨ ${TT("A special breed: can't be bred or found in eggs.",'สายพันธุ์พิเศษ: ผสมพันธุ์ไม่ได้ และไม่มีในไข่กาชา')}</span>`:''}`,
  go:()=>{PS.buy={id,shop:1};psSend(prem?{t:'pet_buy',k:'p',id}:{t:'pet_buy',k:'d',i:+d.i})}})};
H.pet_shop=m=>{PS.pend=0;PS.shop=m;PS.stuck=0;psSoft()};
H.pet_stock=m=>{const s=PS.shop;if(!s)return;let ch=false;
 if(m.prem&&typeof m.prem=='object')for(const p of s.prem){const l=m.prem[p.id];if(Number.isFinite(l)&&l!=p.left){p.left=l;ch=true}}
 if(Array.isArray(m.offers))for(const o of s.offers){const l=m.offers[o.i];if(Number.isFinite(l)&&l!=o.left){o.left=l;ch=true}}
 if(ch)psSoft()};
H.pet_bought=m=>{PS.pend=0;sfx('coin');closeMod('ask');const d=m&&m.dog;if(!d)return;const buy=PS.buy;PS.buy=null;
 if(!m.mk&&typeof Egg!='undefined'&&Egg.reveal){try{Egg.reveal(d,{src:'shop',mixed:false,onClose:()=>{}});return}catch(e){}}
 psAdopt(d,{mk:!!m.mk,seller:buy&&buy.s})};

const WHY={visit:['Go to your own house first','ต้องอยู่บ้านตัวเองก่อนนะ'],fav:['⭐ Favourites can not be sold — remove the star first','⭐ ขายตัวโปรดไม่ได้ (เอาดาวออกก่อนนะ)'],last:['You must keep at least 1 dog at home','ต้องมีน้องหมาอยู่บ้านอย่างน้อย 1 ตัวนะ'],
 guest:['Guests can not use the Market — please sign up first','ผู้เล่น Guest ใช้ตลาดไม่ได้ — สมัครสมาชิกก่อนนะ'],lvl:['','']};
function dogWhy(d,kind){const all=S.allDogs||[],home=all.filter(x=>!x.away).length;
 if(S.owner!=S.name)return TT(...WHY.visit);if(d.fav)return TT(...WHY.fav);if(S.allDogs&&(all.length<=1||(!d.away&&home<=1)))return TT(...WHY.last);
 if(kind=='list'){if(S.guest)return TT(...WHY.guest);const lv=V7().mkLvl||3;if((S.me.lvl|0)<lv)return TT(`You need level ${lv} to list dogs (you are level ${S.me.lvl|0})`,`ต้องเลเวล ${lv} ขึ้นไปถึงจะลงขายได้ (ตอนนี้เลเวล ${S.me.lvl|0})`);
  const mx=V7().mkMax||5;if(myListings()>=mx)return TT(`You can only have ${mx} listings at once`,`ลงขายพร้อมกันได้ไม่เกิน ${mx} ตัว`)}
 return''}
const myListings=()=>PS.mk?PS.mk.list.filter(e=>e.mine).length:0;
function dogValue(d){const b=DOGS.BR[d.breed];if(!b)return 0;return TRD.sellValue(d,b.r,b.pm||null,NOW(),S.gk||1)}
function psSellHTML(){const all=S.allDogs;if(!all)return loadingHTML(TT('Loading your dogs…','กำลังโหลดน้องหมา…'));
 const visit=S.owner!=S.name;
 const rows=all.map(d=>({d,v:dogValue(d),why:dogWhy(d,'sell'),why2:dogWhy(d,'list')})).sort((a,b)=>(!!a.why-!!b.why)||b.v-a.v||(RANK[(DOGS.BR[b.d.breed]||{}).r]|0)-(RANK[(DOGS.BR[a.d.breed]||{}).r]|0));
 return`<div class="psinfo">💰 ${TT("Sell a dog to the shop and get coins right away. The price depends on breed, age, bond, mixed breeds and lucky marks. Selling can't be undone!",'ขายน้องหมาให้ร้านแล้วได้ทองทันที ราคาขึ้นกับสายพันธุ์ วัย ความผูกพัน พันทาง และลายพิเศษ · ขายแล้วเอาคืนไม่ได้นะ!')}</div>
 ${visit?`<div class="psban warn"><b>🏡 ${TT('You are visiting '+esc(S.owner),'ตอนนี้อยู่บ้าน '+esc(S.owner))}</b> — ${TT('go home to sell dogs.','กลับบ้านตัวเองก่อนถึงจะขายได้นะ')} <button class="btn sm sky" data-do="home">🏠 ${TT('Go Home','กลับบ้าน')}</button></div>`:''}
 <div class="psl">${rows.map(({d,v,why,why2})=>sellRow(d,v,why,why2)).join('')||emptyState('ยังไม่มีน้องหมาเลย~','No dogs yet~','🐶')}</div>`}
function sellRow(d,v,why,why2){const b=DOGS.BR[d.breed]||{r:'C'};
 return`<div class="psrow r-${b.r}"><div class="psrow-art">${thumbHTML(DOGS.k(d),d.variant,34,d.acc)}</div>
  <div class="psrow-bd"><div class="psrow-nm"><b>${esc(d.name)}</b> ${rarTag(b.r)}${d.fav?' <span title="'+TT('Favourite','ตัวโปรด')+'">⭐</span>':''}${d.cr?' <span title="'+TT('Crowned','ได้มงกุฎ')+'">👑</span>':''}${d.away?` <span class="psch">🚪 ${TT('Away','ไม่อยู่บ้าน')}</span>`:''}</div>
   <div class="psrow-br">${esc(DOGS.nm(d))}</div><div class="psrow-ch">${dogChips(d)}</div><div class="psrow-h">${hearts(d.bond)}</div>${why?`<div class="psc-why left">🔒 ${esc(why)}</div>`:''}</div>

   <button class="btn sm ${why2?'psno':'lav'}" ${why2?'aria-disabled="true"':''} data-do="mklist" data-id="${esc(d.id)}">🏷️ ${TT('Market','ตลาด')}</button></div></div>`}

 if(PS.sellId&&S.profId==PS.sellId)closeMod('prof');PS.sellId=null;send({t:'dogs_get'})};

 return`<div class="mkc r-${b.r} ${e.mine?'mine':''}">${e.mine?`<span class="mkc-mine">★ ${TT('Yours','ของฉัน')}</span>`:''}

  <div class="mkc-ch">${dogChips(d)}</div><div class="psheart">${hearts(d.bond)}</div>

  <div class="psc-pr ${cur=='g'?'gem':''}">${priceHTML(cur,n)}</div>

   :`<button class="btn ${why?'psno':cur=='g'?'sky':'pink'}" ${why?'aria-disabled="true"':''} data-do="mkbuy" data-id="${esc(e.id)}">🛒 ${TT('Buy','ซื้อ')}</button><div class="psc-why">${esc(why)}</div>`}</div>`}
function psMarketHTML(){const M=PS.mk,v=V7(),fee=(M&&M.fee)||v.fee||.05;
 const info=`<div class="psmk-info">🏷️ ${TT(`Players sell dogs to each other here. Fee ${Math.round(fee*100)}% · up to ${v.mkMax||5} listings · stays ${v.mkH||48} h · sellers need Lv ${v.mkLvl||3}`,`ผู้เล่นขายน้องหมาให้กันที่นี่ · ค่าธรรมเนียม ${Math.round(fee*100)}% · ลงขายได้ ${v.mkMax||5} ตัว · ค้างได้ ${v.mkH||48} ชม. · ต้องเลเวล ${v.mkLvl||3} ขึ้นไป`)}</div>`;
 if(!M)return`<div class="psmk-bar">${info}</div>`+loadingHTML();
 const mine=M.list.filter(e=>e.mine).length,
  filt=[['all',TT('All','ทั้งหมด')],['c','💰 '+TT('Coins','ทอง')],['g','💎 '+TT('Gems','เพชร')],['rare','🌟 '+TT('Rare','หายาก')],['mine','★ '+TT('Mine','ของฉัน')+' '+mine]];
 let L=M.list.map((e,i)=>Object.assign(e,{ord:i})).filter(e=>PS.filt=='all'||(PS.filt=='c'&&e.c>0)||(PS.filt=='g'&&e.g>0)||(PS.filt=='rare'&&isRare(e))||(PS.filt=='mine'&&e.mine));

 get();send({t:'dogs_get'});Sh.dogsRef=S.allDogs;render(true);if(!Sh.timer)Sh.timer=setInterval(tick,1000);startLive()};
DO.shTab=d=>{if(!['today','prev','hall'].includes(d.k)||Sh.tab===d.k)return;Sh.tab=d.k;Sh.sig='';render()};
DO.shPv=()=>{Sh.pv=!Sh.pv;render()};
DO.shGuide=()=>{Sh.guide=!Sh.guide;render()};
DO.shRetry=()=>{Sh.st=null;get();send({t:'dogs_get'});render()};
DO.shPick=d=>{if(!d.id||Sh.pick===d.id)return;Sh.pick=d.id;sfx('pop');render()};
DO.shEnter=()=>{const st=Sh.st;if(!st)return;const me=st.me;
 if(me.guest||!me.canEnter)return sfx('err'),toast(TT('Sign up for a free account to join the show!','สมัครสมาชิกฟรีก่อนนะ ถึงจะส่งน้องหมาเข้าประกวดได้!'));
 if(ph0(st.ph)!='enter')return sfx('err'),toast(TT('Sign-ups are closed — see you next round!','ปิดรับสมัครแล้ว เจอกันรอบหน้านะ!'));
 const d=(S.allDogs||[]).find(x=>x.id===Sh.pick);if(!d)return sfx('err'),toast(TT('Pick one of your dogs first','เลือกน้องหมาของคุณก่อนนะ'));
 if(lock('enter',900))return;
 if(me.entered&&me.entered.id===d.id&&dogSig(me.entered)==dogSig(d))return toast(TT('This dog is already in the show 🐾','น้องตัวนี้อยู่ในการประกวดแล้วนะ 🐾'));
 if(!send({t:'sh_enter',dog:d.id}))return sfx('err'),toast(TT('Not connected yet — try again in a moment','ยังไม่ได้เชื่อมต่อ ลองใหม่อีกครั้งนะ'));
 sfx('ok');resync()};
DO.shLeave=()=>{const st=Sh.st;if(!st||!st.me.entered)return;if(ph0(st.ph)!='enter')return toast(TT('Sign-ups are closed','ปิดรับสมัครแล้ว'));if(lock('leave',900))return;
 if(send({t:'sh_unenter'})){toast(TT('Your dog left the show','ถอนน้องหมาออกจากการประกวดแล้ว'));resync()}else toast(TT('Not connected yet — try again in a moment','ยังไม่ได้เชื่อมต่อ ลองใหม่อีกครั้งนะ'))};
DO.shVote=d=>{const st=Sh.st;if(!st)return;const me=st.me,n=String(d.n||'');
 if(ph0(st.ph)!='vote')return sfx('err'),toast(TT('Voting is not open right now','ตอนนี้ยังไม่เปิดโหวตนะ'));
 if(me.guest)return sfx('err'),toast(TT('Sign up for a free account to vote','สมัครสมาชิกฟรีก่อนถึงจะโหวตได้นะ'));
 if(!me.canVote)return sfx('err'),toast(TT('Reach level '+me.lvl+' to vote — you are level '+(S.me.lvl|0)+'. Keep caring for your dogs!','ต้องเลเวล '+me.lvl+' ขึ้นไปถึงจะโหวตได้ (ตอนนี้เลเวล '+(S.me.lvl|0)+') ดูแลน้องหมาเก็บ XP กันนะ'));
 if(isMe(n))return sfx('err'),toast(TT('You cannot vote for your own dog 😆','โหวตให้หมาตัวเองไม่ได้นะ 😆'));
 if(!st.entries.some(e=>e.n===n))return;
 const has=me.votes.includes(n);
 if(!has&&me.votes.length>=st.votes)return sfx('err'),toast(TT('All '+st.votes+' votes used — tap a ♥ again to take one back','ใช้โหวตครบ '+st.votes+' คะแนนแล้ว กด ♥ ซ้ำเพื่อยกเลิกได้'));
 if(lock('v:'+n))return;
 const keep=me.votes.slice();me.votes=has?me.votes.filter(x=>x!==n):me.votes.concat(n);        // optimistic: the server's answer (a fresh 'sh') replaces it, a rejection is caught by resync()
 if(!send({t:'sh_vote',n})){me.votes=keep;return sfx('err'),toast(TT('Not connected yet — try again in a moment','ยังไม่ได้เชื่อมต่อ ลองใหม่อีกครั้งนะ'))}
 sfx(has?'click':'pop');render();resync()};
// ---------------------------------------------------------------- pieces
const hearts=(left,total)=>Array.from({length:Math.max(0,total)},(_,i)=>`<span class="ds-h ${i<left?'on':''}">${ic(i<left?'heart':'hearte','big')}</span>`).join('');
const prizeChips=st=>{const pz=st.prize||{},top=Array.isArray(pz.top)?pz.top:[],part=pz.part||{};
 return top.map((r,i)=>`<span class="ds-pz p${i+1}"><b>${MED[i]||'🏅'}</b><span class="rw">${rewardTxt(r||{})}</span></span>`).join('')+`<span class="ds-pz pp"><b>🎖️</b><em>${TT('everyone else','ทุกตัวที่เข้าร่วม')}</em><span class="rw">${rewardTxt(part)}</span></span>`};
function hero(st,mini){return`<div class="ds-stage ${mini?'mini':''}"><div class="ds-flags"></div><div class="ds-spot"></div><div class="ds-curt l"></div><div class="ds-curt r"></div>
 <div class="ds-hero"><div class="ds-cup"><span>🏆</span><i class="s1">✨</i><i class="s2">⭐</i><i class="s3">✨</i></div>
 <div class="ds-ht"><h3>${TT('Cozy Dog Show','ประกวดน้องหมา')}</h3><p>${TT('Every player on the server is a judge — a new show '+everyTxt(st.ms)+'!','ผู้เล่นทุกคนในเซิร์ฟเวอร์ช่วยกันเป็นกรรมการ — จัดประกวดใหม่'+everyTxt(st.ms)+'!')}</p><p class="crw">👑 ${TT('The winner\'s dog wears a golden crown for 24 hours and joins the 🏛️ Hall of Fame.','หมาของผู้ชนะได้สวมมงกุฎทอง 24 ชั่วโมง และได้ขึ้นหอเกียรติยศ 🏛️')}</p></div>
 <div class="ds-prizes">${prizeChips(st)}</div></div><div class="ds-floor"></div></div>`}
const scoreExplain=()=>`<div class="ds-eq"><span>🏆 ${TT('Score','คะแนนรวม')}</span><b>=</b><span class="a">♥ ${TT('votes','โหวต')} × 3</span><b>+</b><span class="b">✨ ${TT('judge\'s charm','เสน่ห์จากกรรมการ')}</span></div>`;
function countCard(st){const n=st.n|0,min=st.min|0,ok=n>=min,pc=Math.min(100,min?n/min*100:100),p=ph0(st.ph);
 const need=Math.max(0,min-n);
 return`<div class="ds-card ds-count ${ok?'ok':'low'}"><div class="ds-bn">🐶<b>${n}</b></div><div class="g"><b>${p=='enter'?TT(n==1?'1 dog has entered':n+' dogs have entered',n+' ตัวสมัครแล้ว'):TT(n+' dogs are competing',n+' ตัวเข้าประกวด')}</b>
 <div class="prog"><i style="width:${pc}%;background:linear-gradient(#ffd9a0,${ok?'#6fd1a5':'#ffb36b'})"></i></div>
 <small>${ok?'✅ '+TT('Enough dogs — the show is on!','ครบแล้ว! การประกวดรอบนี้จัดแน่นอน'):p=='enter'?'🐾 '+TT('At least '+min+' dogs are needed, '+need+' more to go — otherwise this round is cancelled.','ต้องมีอย่างน้อย '+min+' ตัว ขาดอีก '+need+' ตัว — ถ้าไม่ครบรอบนี้จะถูกยกเลิก'):'⚠️ '+TT('Only '+n+' dogs signed up (needs '+min+'): this round will be cancelled.','มีแค่ '+n+' ตัว (ต้องมี '+min+'): รอบนี้จะถูกยกเลิกนะ')}</small></div></div>`}
function guestNote(what){return`<div class="ds-card ds-guest">${emptyState('สมัครสมาชิกฟรีก่อนนะ~ ผู้เล่น Guest ส่งหมาเข้าประกวด'+(what=='vote'?'และโหวต':'')+'ไม่ได้ แต่ดูการประกวดได้เลย!','Create a free account to join — guests can watch the show, but cannot enter'+(what=='vote'?' or vote':'')+'.','🎟️')}</div>`}
function guide(st){const o=Sh.guide,v=st.votes|0,min=st.min|0;
 const li=(e,en,th)=>`<li><i>${e}</i><span>${TT(en,th)}</span></li>`;
 return`<div class="ds-guide ${o?'open':''}"><button class="ds-gb" data-do="shGuide" aria-expanded="${o}">❓ ${TT('How does the show work?','การประกวดทำงานยังไง?')} <span>${o?'▲':'▼'}</span></button>${o?`<ol class="ds-gl">
 ${li('🎪','Sign-ups: pick ONE of your dogs (any of them, even one that is away). You can switch dogs until sign-ups close, or withdraw.','รับสมัคร: เลือกน้องหมาได้ 1 ตัว (ตัวไหนก็ได้ แม้ไม่ได้อยู่บ้าน) เปลี่ยนตัวหรือถอนตัวได้จนกว่าจะปิดรับสมัคร')}
 ${li('🗳️','Voting: every player is a judge! You get '+v+' ♥ votes (tap a ♥ again to take it back). You cannot vote for yourself, and you need level '+st.me.lvl+'. Your first vote of the round pays +10 coins.','โหวต: ทุกคนเป็นกรรมการ! มี '+v+' ♥ โหวต (กด ♥ ซ้ำเพื่อยกเลิก) โหวตให้ตัวเองไม่ได้ และต้องเลเวล '+st.me.lvl+' ขึ้นไป โหวตแรกของรอบได้ +10 เหรียญ')}
 ${li('✨','The judge\'s charm adds a few points: Bond, cute traits, rarity, mixed breed, grown-up and accessory. Every vote is worth 3 points, so being loved matters most!','เสน่ห์จากกรรมการช่วยเพิ่มคะแนนอีกหน่อย: Bond ลายน่ารัก ความหายาก พันทาง โตเต็มวัย เครื่องประดับ — แต่โหวตละ 3 คะแนน ความน่ารักที่คนชอบสำคัญที่สุด!')}
 ${li('🏆','Results: score = votes × 3 + charm. Ties go to the dog that signed up first. Vote counts stay secret until the results.','ผลตัดสิน: คะแนน = โหวต × 3 + เสน่ห์ เสมอกันตัวที่สมัครก่อนชนะ ยอดโหวตจะถูกเก็บเป็นความลับจนกว่าจะประกาศผล')}
 ${li('✉️','Prizes arrive in your Mail ✉️ — everyone who entered gets something. A show needs at least '+min+' dogs, otherwise the round is cancelled.','รางวัลส่งเข้ากล่องจดหมาย ✉️ — ทุกตัวที่เข้าร่วมได้รางวัลหมด ต้องมีอย่างน้อย '+min+' ตัว ไม่งั้นรอบนั้นจะถูกยกเลิก')}</ol>`:''}</div>`}
// ---------------------------------------------------------------- sign-up phase
function myCard(st){const d=st.me.entered;if(!d)return'';const c=charm(d,now()),live=(S.allDogs||[]).find(x=>x.id===d.id),lc=live?charm(live,now()):null,changed=live&&dogSig(live)!=dogSig(d);
 return`<div class="ds-card ds-mine"><div class="ds-rib">✔ ${TT('Your contestant','ตัวแทนของคุณ')}</div><div class="ds-mw">${art(d,64,'ds-live')}<div class="g"><h4>${esc(d.name)} <i>${PERS_EM[d.pers]||''}</i></h4><div class="ds-br">${bname(d)} ${rarTag(rarOf(d))}</div><div class="ds-chips">${chips(d,true)}</div>
 <div class="ds-cm">✨ ${TT('Charm','เสน่ห์')} <b>${c.total}</b> <small>${TT('(from the day you signed up)','(ตอนที่สมัคร)')}</small></div></div></div>
 ${changed&&lc?`<div class="ds-chg">🔄 ${lc.total!=c.total?TT('Your dog has changed since sign-up: charm '+c.total+' → '+lc.total+'. Update the entry to show it off!','น้องเปลี่ยนไปจากตอนสมัคร: เสน่ห์ '+c.total+' → '+lc.total+' กดอัปเดตเพื่อใช้ค่าใหม่!'):TT('Your dog has changed since sign-up. You can update the entry.','น้องเปลี่ยนไปจากตอนสมัคร กดอัปเดตได้นะ')}</div>`:''}
 <div class="ds-ma"><button class="btn ghost sm" data-do="shLeave">↩ ${TT('Withdraw','ถอนตัว')}</button><span class="muted">${TT('You can switch dogs until sign-ups close.','เปลี่ยนตัวได้จนกว่าจะปิดรับสมัคร')}</span></div></div>`}
function charmPanel(d){const c=charm(d,now());
 return`<div class="ds-card ds-pv ${Sh.pv?'open':''}"><button class="ds-pvh" data-do="shPv" aria-expanded="${!!Sh.pv}">${art(d,40)}<div class="g"><b>${esc(d.name)}</b><small>${TT('Why this charm?','ทำไมได้เสน่ห์เท่านี้?')}</small></div><div class="ds-big">✨<b>${c.total}</b></div><span class="ds-chev">${Sh.pv?'▴':'▾'}</span></button>
 <div class="ds-pvb"><div class="ds-cl">${c.P.map(p=>`<div class="ds-cr ${p.v>0?'on':''}"><i>${p.e}</i><div class="g"><b>${esc(TT(p.en,p.th))}</b>${p.v>0?'':`<small>${esc(TT(p.hen,p.hth))}</small>`}</div><span class="v">${p.tx}</span></div>`).join('')}</div>
 <div class="ds-sum"><span>${TT('Total (rounded)','รวม (ปัดเศษ)')}</span><b>✨ ${c.total}</b></div>
 <div class="ds-warn">⚠️ ${TT('Charm is only a small part of the score! Every vote you get is worth 3 points.','เสน่ห์เป็นแค่ส่วนเล็กๆ ของคะแนน! ทุกโหวตที่ได้มีค่า 3 คะแนน')}</div>${scoreExplain()}</div></div>`}
function picker(st){const dogs=S.allDogs;
 if(!dogs)return`<div class="ds-card ds-load"><div class="ds-pup">🐶</div>${TT('Fetching your dogs…','กำลังเรียกน้องหมาของคุณ…')}</div>`;
 if(!dogs.length)return`<div class="ds-card">${emptyState('ยังไม่มีน้องหมาให้ส่งประกวดเลย','You have no dogs to enter yet.','🐶')}</div>`;
 const at=now(),me=st.me,crowned=new Set(dogs.filter(d=>d.cr).map(d=>d.id)),list=dogs.map(d=>({d,c:charm(d,at)})).sort((a,b)=>b.c.total-a.c.total||(b.d.bond|0)-(a.d.bond|0)||String(a.d.name).localeCompare(String(b.d.name)));
 if(!list.some(x=>x.d.id===Sh.pick))Sh.pick=(me.entered&&list.some(x=>x.d.id===me.entered.id)?me.entered.id:list[0].d.id);
 const sel=list.find(x=>x.d.id===Sh.pick),best=list[0].d.id,inShow=me.entered&&me.entered.id===sel.d.id,changed=inShow&&dogSig(me.entered)!=dogSig(sel.d);
 const cards=list.map(({d,c})=>`<button class="ds-dog r-${rarOf(d)} ${d.id===Sh.pick?'sel':''} ${me.entered&&me.entered.id===d.id?'in':''}" data-do="shPick" data-id="${esc(d.id)}" aria-pressed="${d.id===Sh.pick}">
  <span class="ds-cb">✨${c.total}</span>${me.entered&&me.entered.id===d.id?`<span class="ds-in">✔</span>`:crowned.has(d.id)?'<span class="ds-in">👑</span>':d.id===best&&list.length>1?'<span class="ds-in best">⭐</span>':''}
  <div class="ds-art">${art(d,46)}</div><b>${esc(d.name)}</b><small>${bname(d)}</small><span class="ds-em">${emoChips(d)||'&nbsp;'}</span></button>`).join('');
 const label=inShow?(changed?'🔄 '+TT('Update my entry','อัปเดตการสมัคร'):'✔ '+TT('Already in the show','อยู่ในการประกวดแล้ว')):me.entered?'🔄 '+TT('Switch to '+esc(sel.d.name),'เปลี่ยนเป็น '+esc(sel.d.name)):'👑 '+TT('Enter '+esc(sel.d.name),'ส่ง '+esc(sel.d.name)+' เข้าประกวด');
 return`<div class="ds-sech"><h4>🐶 ${me.entered?TT('Switch to another dog?','อยากเปลี่ยนตัวไหม?'):TT('Pick your contestant','เลือกตัวแทนของคุณ')}</h4><span class="muted">${TT('Best charm first','เรียงตามเสน่ห์มากไปน้อย')}</span></div>
 <div class="ds-sel"><div class="ds-grid">${cards}</div><div class="ds-side">${charmPanel(sel.d)}</div></div>
 <div class="ds-act"><div class="ds-ai">${art(sel.d,22)}<div class="g"><b>${esc(sel.d.name)}</b><small>✨ ${TT('Charm','เสน่ห์')} ${sel.c.total}</small></div></div><button class="btn ${inShow&&!changed?'ghost shno':'pink'}" data-do="shEnter">${label}</button></div>`}
function whoIn(st){if(!st.entries.length)return`<div class="ds-sech"><h4>🎪 ${TT('Who is in the show?','ใครมาประกวดบ้าง?')}</h4></div><div class="ds-card">${emptyState('ยังไม่มีใครสมัครเลย — เป็นคนแรกกันนะ!','Nobody has signed up yet — be the first!','🎪')}</div>`;
 const L=shuffled(st.entries,st),cr=crownedIds(st),cap=30;
 return`<div class="ds-sech"><h4>🎪 ${TT('Who is in the show?','ใครมาประกวดบ้าง?')} <span class="pill">${st.entries.length}</span></h4><span class="muted">${TT('Votes and charm stay secret until the results.','โหวตและเสน่ห์เป็นความลับจนกว่าจะประกาศผล')}</span></div>
 <div class="ds-mini">${L.slice(0,cap).map(e=>`<div class="ds-m ${isMe(e.n)?'me':''}">${cr.has(e.d.id)?'<span class="ds-cw">👑</span>':''}<div class="ds-art">${art(e.d,30)}</div><b>${esc(e.d.name)}</b><small>${isMe(e.n)?TT('you','คุณ'):esc(e.n)}</small></div>`).join('')}${L.length>cap?`<div class="ds-m more">+${L.length-cap}</div>`:''}</div>`}
function viewEnter(st){const me=st.me;let h=hero(st)+countCard(st);
 if(me.guest)h+=guestNote('enter');else{h+=myCard(st)+picker(st)}
 return h+whoIn(st)}
// ---------------------------------------------------------------- vote phase
function viewVote(st){const me=st.me,left=Math.max(0,st.votes-me.votes.length),cr=crownedIds(st),L=shuffled(st.entries,st),others=L.filter(e=>!isMe(e.n));
 let why='';
 if(me.guest)why=guestNote('vote');
 else if(!me.canVote)why=`<div class="ds-card ds-lock">🔒 <div class="g"><b>${TT('Reach level '+me.lvl+' to vote','ต้องเลเวล '+me.lvl+' ขึ้นไปถึงจะโหวตได้')}</b><small>${TT('You are level '+(S.me.lvl|0)+'. Care for your dogs to earn XP — you can still look at everybody!','ตอนนี้คุณเลเวล '+(S.me.lvl|0)+' ดูแลน้องหมาเก็บ XP แล้วมาโหวตกันนะ — ดูน้องๆ ได้เหมือนเดิม!')}</small></div></div>`;
 const status=(me.guest||!me.canVote)?'':`<div class="ds-card ds-vs"><div class="ds-hr">${hearts(left,st.votes)}</div><div class="g"><b>${left?TT('You have '+left+' of '+st.votes+' votes left','เหลือ '+left+' จาก '+st.votes+' โหวต'):'💖 '+TT('All votes used — thank you, judge!','ใช้โหวตครบแล้ว ขอบคุณกรรมการมาก!')}</b>
  <small>${me.votes.length?TT('Tap a ♥ again to take it back.','กด ♥ ซ้ำเพื่อยกเลิกโหวต'):TT('Your first vote of the round pays +10 💰','โหวตแรกของรอบนี้ได้ +10 💰')} · ${TT('Vote counts stay secret until the results.','ยอดโหวตเป็นความลับจนกว่าจะประกาศผล')}</small></div></div>`;
 const warn=st.n<st.min?`<div class="ds-card ds-lock">⚠️ <div class="g"><b>${TT('Only '+st.n+' dog'+(st.n==1?'':'s')+' entered','มีแค่ '+st.n+' ตัวที่สมัคร')}</b><small>${TT('A show needs at least '+st.min+' dogs, so this round will be cancelled.','การประกวดต้องมีอย่างน้อย '+st.min+' ตัว รอบนี้จึงจะถูกยกเลิก')}</small></div></div>`:'';
 const card=e=>{const d=e.d,mine=isMe(e.n),voted=me.votes.includes(e.n),can=!me.guest&&me.canVote,full=!voted&&left<=0;
  return`<div class="ds-c r-${rarOf(d)} ${voted?'voted':''} ${mine?'mine':''}">${mine?`<span class="ds-tg">💖 ${TT('yours','ของคุณ')}</span>`:''}${cr.has(d.id)?'<span class="ds-cw">👑</span>':''}

// Cozy Dogs v7.2 - cute dog barks (made with the Web Audio API, no sound files): a "woof woof" to say hello, a happy "yip!" when petted, a tiny squeak for a newborn.
// Small dogs sound higher than big ones, puppies higher than adults, and every bark is a little bit different.  Setting: "Dog sounds" (S.set.barks); the general sound switch also mutes it.
// Bark.say(kind, dog, force)  kind = 'woof' | 'yip' | 'happy' | 'pup'     Bark.greet()  = one of the dogs in this room says hello
(function(){
const Bk={last:0,per:{},home:'',homeAt:0};
const rnd=(a,b)=>a+Math.random()*(b-a);
// pitch of a dog: smaller = higher, younger = higher  (size is 0.7 .. 1.3 in the breed table, composite/mixed dogs average it)
function pitchOf(d){let size=1,stage=3;try{const b=d&&(DOGS.b(d)||DOGS.BR&&DOGS.BR[d.breed]);if(b&&b.size)size=b.size}catch(e){}
 try{if(d&&d.born&&typeof TRD!='undefined')stage=TRD.stageOf(d.born,Date.now()+(S.skew||0),S.gk||1)}catch(e){}
 return 300/Math.min(1.4,Math.max(.6,size))*[2,1.55,1.2,1][Math.max(0,Math.min(3,stage|0))]*rnd(.96,1.05)}
// one syllable: a saw wave whose pitch dips, run through two "mouth" filters (formants), plus a puff of breath
function syl(f0,len,vol,when,o){const a=actx();if(!a)return;o=o||{};const t0=a.currentTime+when,rise=o.rise||0;
 const osc=a.createOscillator(),osc2=a.createOscillator(),mix=a.createGain(),env=a.createGain(),fa=a.createBiquadFilter(),fb=a.createBiquadFilter();
 osc.type='sawtooth';osc2.type='square';
 const p=(k,t)=>Math.max(60,f0*k);const up=rise>0;
 // woof: starts high, falls.  yip: starts low, rises quickly then drops a little
 osc.frequency.setValueAtTime(p(up?.8:1.22),t0);osc.frequency.exponentialRampToValueAtTime(p(up?1.25:1),t0+len*.3);osc.frequency.exponentialRampToValueAtTime(p(up?1.05:.72),t0+len);
 osc2.frequency.setValueAtTime(p((up?.8:1.22)*.5),t0);osc2.frequency.exponentialRampToValueAtTime(p((up?1.25:1)*.5),t0+len*.3);osc2.frequency.exponentialRampToValueAtTime(p((up?1.05:.72)*.5),t0+len);
 fa.type='bandpass';fa.frequency.value=(o.f1||720)*(up?1.15:1);fa.Q.value=4.5;fb.type='bandpass';fb.frequency.value=(o.f2||1750)*(up?1.2:1);fb.Q.value=6;
 const g2=a.createGain();g2.gain.value=.35;osc.connect(mix);osc2.connect(g2);g2.connect(mix);mix.connect(fa);mix.connect(fb);
 const out=a.createGain();out.gain.value=1;fa.connect(out);fb.connect(out);out.connect(env);
 env.gain.setValueAtTime(0,t0);env.gain.linearRampToValueAtTime(vol,t0+.012);env.gain.setValueAtTime(vol*.8,t0+len*.4);env.gain.exponentialRampToValueAtTime(.001,t0+len+.04);
 env.connect(AU.sfx);osc.start(t0);osc2.start(t0);osc.stop(t0+len+.08);osc2.stop(t0+len+.08);
 noise(.05,vol*.18,when,2600)}
const KINDS={
 woof:f=>{syl(f,.17,.22,0);syl(f*1.07,.19,.24,.23)},                       // hello: "wuf wuf"
 yip:f=>{syl(f*1.7,.1,.17,0,{rise:1,f1:900,f2:2300})},                      // happy: one bright "yip!"
 happy:f=>{syl(f*1.6,.09,.16,0,{rise:1,f1:900,f2:2300});syl(f*1.8,.09,.16,.14,{rise:1,f1:900,f2:2300});syl(f*1.15,.2,.22,.3)},   // very happy: "yip yip wuf!"
 pup:f=>{syl(f*1.5,.07,.13,0,{rise:1,f1:1000,f2:2600});syl(f*1.7,.08,.13,.1,{rise:1,f1:1000,f2:2600})}};        // newborn squeak
const BUB={woof:['Woof woof!','โฮ่ง โฮ่ง!'],yip:['Yip!','ยิ๊บ!'],happy:['Yip yip woof!','ยิ๊บ ยิ๊บ โฮ่ง!'],pup:['Yip yip~','แงะ ๆ~']};
Bk.say=function(kind,d,force){try{
  if(S.set.barks===false||!S.set.sound||!KINDS[kind])return false;
  const now=performance.now(),id=d&&d.id||'x';
  if(!force&&(now-Bk.last<650||now-(Bk.per[id]||0)<3500))return false;      // never a barking storm: one sound at a time, one dog every 3.5 s
  Bk.last=now;Bk.per[id]=now;KINDS[kind](pitchOf(d));
  // a little speech bubble above the dog (also helps when the phone is on silent)
  try{if(d&&d._pos&&S.set.particles!==false){const[x,y,L]=d._pos,w=BUB[kind];floatText(x,y-L-(d._top||0)-22,TT(w[0],w[1]),'#fff4c2')}}catch(e){}
  return true}catch(e){return false}};
Bk.maybe=(kind,d,chance)=>Math.random()<chance&&Bk.say(kind,d);
Bk.greet=function(){const l=Object.values(S.dogs||{});if(!l.length)return;Bk.say('woof',l[Math.floor(Math.random()*l.length)],true)};
// say hello when the player arrives in a house (own home, a friend's house, or back from the park): one of the dogs there barks
setInterval(()=>{try{if(S.scr!='game'||!S.loaded||Park.on||(typeof MP!='undefined'&&MP.g))return;const key=String(S.owner);
  if(key!==Bk.home){Bk.home=key;Bk.homeAt=performance.now()}
  else if(Bk.homeAt&&performance.now()-Bk.homeAt>900&&Object.keys(S.dogs||{}).length){Bk.homeAt=0;Bk.greet()}}catch(e){}},400);
Object.assign(TH,{'Dog sounds':'เสียงน้องหมา'});
window.Bark=Bk;
// the old generic "bark" sound effect (play with a dog, park pose) is now the cute one
SFX.bark=()=>{Bk.say('woof',null,true)};
})();
</script>
</body></html>
